<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nellus Coworking - Gestão</title>
  
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Bibliotecas de Exportação XLS e PDF -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap');

    body {
      margin: 0;
      padding: 16px;
      background-color: #EFEAE0;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .nellus-app {
      --ink: #1B2420;
      --muted: #8A8578;
      --paper: #F7F5F0;
      --surface: #FFFFFF;
      --border: #E4DFD3;
      --teal: #0E6E56;
      --teal-deep: #0A4F3E;
      --orange: #E08A52;
      --orange-deep: #C96B34;
      --up: #1F9D6C;
      --down: #C1483B;
      color: var(--ink);
      background: var(--paper);
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 800px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    .nellus-app * { box-sizing: border-box; }

    @media (max-width: 800px) {
      .nellus-app { grid-template-columns: 1fr; }
    }

    .sidebar {
      background: linear-gradient(180deg, var(--teal-deep), #08392C 85%);
      color: #EFEAE0;
      padding: 26px 18px;
      display: flex;
      flex-direction: column;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 28px; }
    .brand-text { display: flex; flex-direction: column; line-height: 1.1; }
    .brand-text b { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; }
    .brand-text span { font-size: 11.5px; color: #B9CFC5; }

    .nav { display: flex; flex-direction: column; gap: 4px; }
    .nav-item {
      display: flex; align-items: center; gap: 11px;
      padding: 10px 12px; border-radius: 10px;
      background: transparent; border: none; cursor: pointer;
      color: #D8E6DE; font-family: inherit; font-size: 14.5px; font-weight: 500;
      text-align: left; transition: background 0.15s ease, color 0.15s ease;
    }
    .nav-item:hover { background: rgba(255,255,255,0.06); }
    .nav-item.active { background: var(--orange); color: #1B2420; font-weight: 600; }

    .sidebar-foot {
      margin-top: auto; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.12);
      font-size: 12px; color: #9FC2B2; line-height: 1.5;
    }
    .sidebar-foot b { color: #EFEAE0; font-size: 13px; }

    .main { padding: 28px 32px 32px; overflow-y: auto; }
    .view-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
    .view-head h2 { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600; margin: 0 0 4px; }
    .view-head p { margin: 0; color: var(--muted); font-size: 13.5px; }

    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn-primary {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--orange); color: #23140A; border: none;
      padding: 9px 15px; border-radius: 10px; font-family: inherit;
      font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap;
      transition: all 0.15s;
    }
    .btn-primary:hover { background: var(--orange-deep); color: #fff; }
    .btn-primary.secondary { background: #E4DFD3; color: #1B2420; }
    .btn-primary.secondary:hover { background: #D0C9B8; }
    .btn-primary.outline { background: #FFFFFF; border: 1px solid var(--border); color: var(--ink); }
    .btn-primary.outline:hover { background: #EAE5D9; }
    .btn-primary.full { width: 100%; justify-content: center; margin-top: 8px; }

    .icon-btn {
      border: none; background: var(--surface); border: 1px solid var(--border);
      width: 32px; height: 32px; border-radius: 8px; display: flex;
      align-items: center; justify-content: center; cursor: pointer; color: var(--ink);
    }
    .icon-btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
    .icon-btn.ghost:hover { background: #F1ECE1; color: var(--down); }

    .inline-input {
      border: 1px solid transparent; background: transparent;
      font-family: inherit; font-size: inherit; color: inherit;
      padding: 3px 6px; border-radius: 6px; width: 100%;
    }
    .inline-input:hover { border-color: var(--border); background: #FFFFFF; }
    .inline-input:focus { border-color: var(--teal); background: #FFFFFF; outline: none; }

    .inline-select {
      border: 1px solid transparent; background: transparent;
      font-family: inherit; font-size: inherit; color: inherit;
      padding: 3px 6px; border-radius: 6px; cursor: pointer;
    }
    .inline-select:hover, .inline-select:focus { border-color: var(--teal); background: #FFFFFF; outline: none; }

    .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; margin-bottom: 12px; }
    .field input, .field select {
      padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border);
      font-family: inherit; font-size: 13.5px; outline: none; background: #fff;
    }
    .field input:focus, .field select:focus { border-color: var(--teal); }

    .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }

    .radio-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .radio-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px;
      border-radius: 20px; border: 1px solid var(--border); font-size: 12.5px;
      cursor: pointer; background: #fff; font-weight: 500;
    }
    .radio-pill.active { background: var(--teal); color: #fff; border-color: var(--teal); }
    .radio-pill input { display: none; }

    .modal-veil {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .modal {
      background: var(--surface); border-radius: 14px; width: 100%; max-width: 500px;
      padding: 22px 24px; border: 1px solid var(--border); box-shadow: 0 12px 32px rgba(0,0,0,0.15);
      max-height: 90vh; overflow-y: auto;
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .modal-head h3 { font-family: 'Fraunces', serif; margin: 0; font-size: 20px; }

    .type-settings-bar {
      display: flex; gap: 12px; margin-bottom: 18px; padding: 12px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      align-items: center; flex-wrap: wrap;
    }
    .type-input-group { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
    .type-input-group input { padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border); font-size: 12px; }

    .client-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .client-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; display: flex; flex-direction: column; gap: 8px;
    }
    .client-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .client-line { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
    .client-card-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 11.5px; }

    .agenda-month-picker {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
      background: var(--surface); padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border);
      width: fit-content;
    }
    .agenda-month-picker label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
    .agenda-month-picker input {
      border: 1px solid var(--border); padding: 5px 8px; border-radius: 6px; font-family: inherit; font-size: 13px;
    }
    .date-rail-wrapper {
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 18px;
    }
    .date-rail { display: flex; gap: 6px; flex-wrap: nowrap; min-width: max-content; }
    .date-chip {
      border: 1px solid var(--border); background: var(--surface); color: var(--ink);
      padding: 6px 12px; border-radius: 20px; font-size: 12.5px; cursor: pointer; font-weight: 500;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .date-chip .day-week { font-size: 10px; text-transform: uppercase; color: var(--muted); }
    .date-chip.active { background: var(--teal); border-color: var(--teal); color: #fff; }
    .date-chip.active .day-week { color: #D8E6DE; }
    .date-chip.has-booking { border-bottom: 3px solid var(--orange); }

    .agenda-list { display: flex; flex-direction: column; gap: 10px; }
    .agenda-row {
      display: flex; align-items: center; gap: 12px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px;
    }
    .agenda-time { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); width: 175px; flex-shrink: 0; }
    .agenda-time input { padding: 2px 4px; font-size: 12px; }
    .agenda-main { display: flex; flex-direction: column; flex: 1; gap: 2px; }

    .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;
    }
    .stat-label { font-size: 12px; color: var(--muted); font-weight: 600; }
    .stat-value { font-size: 20px; font-weight: 700; }
    .stat-value.up { color: var(--up); }
    .stat-value.down { color: var(--down); }

    .financial-chart-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 20px;
    }
    .financial-status-tag {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 20px;
    }
    .financial-status-tag.positive { background: #E3F8EC; color: var(--up); border: 1px solid #B8ECCB; }
    .financial-status-tag.negative { background: #FDEEEC; color: var(--down); border: 1px solid #F5C6C1; }

    .progress-bar-container {
      width: 100%;
      height: 20px;
      background: #EFEAE0;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      margin: 12px 0 8px;
    }
    .progress-bar-fill.in { background: var(--up); height: 100%; transition: width 0.3s ease; }
    .progress-bar-fill.out { background: var(--down); height: 100%; transition: width 0.3s ease; }

    .tx-panel {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 18px; margin-bottom: 20px;
    }
    .chart-panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .chart-panel-head h3 { margin: 0; font-family: 'Fraunces', serif; font-size: 18px; }

    .tx-list { display: flex; flex-direction: column; gap: 8px; }
    .tx-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .tx-row:last-child { border-bottom: none; }
    .tx-main { display: flex; flex-direction: column; flex: 1; gap: 2px; }
    .tx-sub { display: flex; gap: 8px; align-items: center; }

    .muted { color: var(--muted); font-size: 12px; }
    .empty-state { padding: 30px; text-align: center; color: var(--muted); background: var(--surface); border-radius: 12px; border: 1px dashed var(--border); }
    .sync-status { font-size: 11px; padding: 4px 9px; border-radius: 12px; background: rgba(255,255,255,0.18); display: inline-block; margin-top: 6px; font-weight: 600; }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect, useMemo, useRef } = React;

  // Endpoint REST direto do Firebase do projeto nellus-gestao
  const DB_BASE_URL = "https://nellus-gestao-default-rtdb.firebaseio.com/nellus";

  const formatBRL = (val) => {
    return Number(val || 0).toLocaleString("pt-BR", {
      style: "currency",
      currency: "BRL",
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  };

  const maskMoneyInput = (rawString) => {
    const digits = String(rawString || "").replace(/\D/g, "");
    if (!digits) return "";
    const amount = Number(digits) / 100;
    return amount.toLocaleString("pt-BR", {
      style: "currency",
      currency: "BRL",
      minimumFractionDigits: 2
    });
  };

  const parseMoneyToFloat = (maskedValue) => {
    if (typeof maskedValue === "number") return maskedValue;
    const digits = String(maskedValue || "").replace(/\D/g, "");
    if (!digits) return 0;
    return parseFloat((Number(digits) / 100).toFixed(2));
  };

  function uid(p) { return p + Math.random().toString(36).slice(2, 8); }

  function Modal({ title, onClose, children }) {
    return (
      <div className="modal-veil" onClick={(e) => e.target === e.currentTarget && onClose()}>
        <div className="modal">
          <div className="modal-head">
            <h3>{title}</h3>
            <button className="icon-btn" onClick={onClose}>✕</button>
          </div>
          {children}
        </div>
      </div>
    );
  }

  // --- AGENDA ---
  function Agenda({ bookings, clients, onAdd, onUpdate, onRemove }) {
    const todayStr = new Date().toISOString().slice(0, 10);
    const [currentMonth, setCurrentMonth] = useState(todayStr.slice(0, 7));
    const [activeDate, setActiveDate] = useState(todayStr);
    const [showForm, setShowForm] = useState(false);
    const [isCustom, setIsCustom] = useState(false);
    const [draft, setDraft] = useState({ clientName: "", date: todayStr, start: "09:00", end: "10:00", room: "", notes: "" });

    const daysInMonth = useMemo(() => {
      const [year, month] = currentMonth.split("-").map(Number);
      const lastDay = new Date(year, month, 0).getDate();
      const list = [];
      for (let d = 1; d <= lastDay; d++) {
        const dd = String(d).padStart(2, "0");
        const fullDate = `${year}-${String(month).padStart(2, "0")}-${dd}`;
        const dateObj = new Date(year, month - 1, d);
        const weekDay = dateObj.toLocaleDateString("pt-BR", { weekday: "short" }).replace(".", "");
        list.push({ date: fullDate, day: dd, weekDay });
      }
      return list;
    }, [currentMonth]);

    const dayBookings = bookings.filter((b) => b.date === activeDate);

    const submit = (e) => {
      e.preventDefault();
      if (!draft.clientName || !draft.room) return;
      onAdd({ ...draft, id: uid("b_") });
      setShowForm(false);
      setDraft({ clientName: "", date: draft.date, start: "09:00", end: "10:00", room: "", notes: "" });
    };

    const exportAgendaXLS = () => {
      const data = bookings.map((b) => ({
        "Data": b.date.split("-").reverse().join("/"),
        "Início": b.start || "",
        "Fim": b.end || "",
        "Cliente": b.clientName || "",
        "Espaço / Sala": b.room || "",
        "Observações": b.notes || ""
      }));
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Agenda");
      XLSX.writeFile(wb, `Agenda_Nellus_${currentMonth}.xlsx`);
    };

    const exportAgendaPDF = () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFont("helvetica", "bold");
      doc.setFontSize(16);
      doc.text("Nellus Coworking - Relatório da Agenda", 14, 18);
      doc.setFontSize(10);
      doc.setFont("helvetica", "normal");
      doc.text(`Mês: ${currentMonth} | Emitido em: ${new Date().toLocaleDateString("pt-BR")}`, 14, 25);

      const tableData = bookings
        .sort((a, b) => a.date.localeCompare(b.date) || a.start.localeCompare(b.start))
        .map((b) => [
          b.date.split("-").reverse().join("/"),
          `${b.start || ""} - ${b.end || ""}`,
          b.clientName || "",
          b.room || "",
          b.notes || ""
        ]);

      doc.autoTable({
        head: [["Data", "Horário", "Cliente", "Espaço / Estação", "Observações"]],
        body: tableData,
        startY: 30,
        theme: 'striped',
        headStyles: { fillColor: [14, 110, 86] },
        styles: { fontSize: 9, font: 'helvetica' }
      });

      doc.save(`Agenda_Nellus_${currentMonth}.pdf`);
    };

    return (
      <div className="view">
        <div className="view-head">
          <div>
            <h2>Agenda ({bookings.length})</h2>
            <p>Reservas centralizadas com visualização do mês inteiro.</p>
          </div>
          <div className="btn-group">
            <button className="btn-primary outline" onClick={exportAgendaXLS}>📥 XLS</button>
            <button className="btn-primary outline" onClick={exportAgendaPDF}>📄 PDF</button>
            <button className="btn-primary" onClick={() => setShowForm(true)}>+ Novo agendamento</button>
          </div>
        </div>

        <div className="agenda-month-picker">
          <label>Selecione o Mês:</label>
          <input
            type="month"
            value={currentMonth}
            onChange={(e) => {
              setCurrentMonth(e.target.value);
              setActiveDate(`${e.target.value}-01`);
            }}
          />
        </div>

        <div className="date-rail-wrapper">
          <div className="date-rail">
            {daysInMonth.map((d) => {
              const hasBooking = bookings.some((b) => b.date === d.date);
              return (
                <button
                  key={d.date}
                  className={`date-chip ${d.date === activeDate ? "active" : ""} ${hasBooking ? "has-booking" : ""}`}
                  onClick={() => setActiveDate(d.date)}
                >
                  <span className="day-week">{d.weekDay}</span>
                  <strong>{d.day}</strong>
                </button>
              );
            })}
          </div>
        </div>

        <div className="agenda-list">
          <div style={{ fontSize: "14px", fontWeight: "600", color: "var(--teal-deep)", marginBottom: "4px" }}>
            Agendamentos para {activeDate.split("-").reverse().join("/")}:
          </div>
          {dayBookings.length === 0 && <div className="empty-state">Nenhum agendamento para este dia.</div>}
          {dayBookings.map((b) => (
            <div className="agenda-row" key={b.id}>
              <div className="agenda-time">
                <span>⏱</span>
                <input type="time" className="inline-input" value={b.start || ""} onChange={(e) => onUpdate({ ...b, start: e.target.value })} />
                <span>–</span>
                <input type="time" className="inline-input" value={b.end || ""} onChange={(e) => onUpdate({ ...b, end: e.target.value })} />
              </div>
              <div className="agenda-main">
                <input 
                  className="inline-input" 
                  style={{ fontWeight: "bold" }} 
                  value={b.clientName || ""} 
                  onChange={(e) => onUpdate({ ...b, clientName: e.target.value })} 
                />
                <div style={{ display: "flex", gap: "8px" }}>
                  <input 
                    className="inline-input muted" 
                    placeholder="Espaço/Sala..." 
                    value={b.room || ""} 
                    onChange={(e) => onUpdate({ ...b, room: e.target.value })} 
                  />
                  <input 
                    className="inline-input muted" 
                    placeholder="Observações..." 
                    value={b.notes || ""} 
                    onChange={(e) => onUpdate({ ...b, notes: e.target.value })} 
                  />
                </div>
              </div>
              <button className="icon-btn ghost" onClick={() => onRemove(b.id)}>🗑</button>
            </div>
          ))}
        </div>

        {showForm && (
          <Modal title="Novo agendamento" onClose={() => setShowForm(false)}>
            <form onSubmit={submit}>
              <div className="field">
                <label>Cliente</label>
                {!isCustom ? (
                  <select value={draft.clientName} onChange={(e) => {
                    if (e.target.value === "NEW") { setIsCustom(true); setDraft({ ...draft, clientName: "" }); }
                    else setDraft({ ...draft, clientName: e.target.value });
                  }}>
                    <option value="">Selecione um cliente...</option>
                    {clients.map((c) => <option key={c.id} value={c.name}>{c.name}</option>)}
                    <option value="NEW">+ Inserir cliente avulso</option>
                  </select>
                ) : (
                  <div style={{ display: "flex", gap: "6px" }}>
                    <input placeholder="Nome do cliente avulso..." value={draft.clientName} onChange={(e) => setDraft({ ...draft, clientName: e.target.value })} style={{ flex: 1 }} />
                    <button type="button" className="btn-primary secondary" onClick={() => setIsCustom(false)}>Lista</button>
                  </div>
                )}
              </div>

              <div className="form-row">
                <div className="field"><label>Data</label><input type="date" value={draft.date} onChange={(e) => setDraft({ ...draft, date: e.target.value })} /></div>
                <div className="field"><label>Início</label><input type="time" value={draft.start} onChange={(e) => setDraft({ ...draft, start: e.target.value })} /></div>
                <div className="field"><label>Fim</label><input type="time" value={draft.end} onChange={(e) => setDraft({ ...draft, end: e.target.value })} /></div>
              </div>

              <div className="field"><label>Espaço / Estação</label><input placeholder="Ex.: Sala de Reunião, Estação 3" value={draft.room} onChange={(e) => setDraft({ ...draft, room: e.target.value })} /></div>
              <div className="field"><label>Observações</label><input value={draft.notes} onChange={(e) => setDraft({ ...draft, notes: e.target.value })} /></div>

              <button className="btn-primary full" type="submit">Salvar Agendamento</button>
            </form>
          </Modal>
        )}
      </div>
    );
  }

  // --- CLIENTES ---
  function Clientes({ clients, typeLabels, setTypeLabels, onAdd, onUpdate, onRemove }) {
    const [showForm, setShowForm] = useState(false);
    const [draft, setDraft] = useState({ name: "", document: "", address: "", type: "presencial", phone: "", email: "" });

    const submit = (e) => {
      e.preventDefault();
      if (!draft.name.trim()) return;

      const novoCliente = {
        ...draft,
        id: uid("c_"),
        since: new Date().toISOString().slice(0, 10)
      };

      onAdd(novoCliente);
      setShowForm(false);
      setDraft({ name: "", document: "", address: "", type: "presencial", phone: "", email: "" });
    };

    return (
      <div className="view">
        <div className="view-head">
          <div>
            <h2>Clientes ({clients.length})</h2>
            <p>Gerenciamento de contratos com salvamento centralizado na nuvem.</p>
          </div>
          <button className="btn-primary" onClick={() => setShowForm(true)}>+ Novo cliente</button>
        </div>

        <div className="type-settings-bar">
          <span style={{ fontSize: "12px", color: "var(--muted)", fontWeight: "bold" }}>Planos:</span>
          <div className="type-input-group">
            <span style={{ color: "#E08A52" }}>●</span>
            <input value={typeLabels.presencial} onChange={(e) => setTypeLabels({ ...typeLabels, presencial: e.target.value })} />
          </div>
          <div className="type-input-group">
            <span style={{ color: "#0E6E56" }}>●</span>
            <input value={typeLabels.salaFixa} onChange={(e) => setTypeLabels({ ...typeLabels, salaFixa: e.target.value })} />
          </div>
          <div className="type-input-group">
            <span style={{ color: "#3E7CB1" }}>●</span>
            <input value={typeLabels.virtual} onChange={(e) => setTypeLabels({ ...typeLabels, virtual: e.target.value })} />
          </div>
        </div>

        {clients.length === 0 ? (
          <div className="empty-state">Nenhum cliente cadastrado ainda. Clique no botão acima para adicionar.</div>
        ) : (
          <div className="client-grid">
            {clients.map((c) => (
              <div className="client-card" key={c.id}>
                <div className="client-card-top">
                  <div style={{ flex: 1 }}>
                    <input 
                      className="inline-input" 
                      style={{ fontWeight: "bold", fontSize: "15px" }} 
                      value={c.name || ""} 
                      placeholder="Nome do cliente" 
                      onChange={(e) => onUpdate({ ...c, name: e.target.value })} 
                    />
                    <input 
                      className="inline-input muted" 
                      value={c.document || ""} 
                      placeholder="CPF / CNPJ" 
                      onChange={(e) => onUpdate({ ...c, document: e.target.value })} 
                    />
                  </div>
                  <select 
                    className="inline-select" 
                    value={c.type || "presencial"} 
                    onChange={(e) => onUpdate({ ...c, type: e.target.value })}
                  >
                    <option value="presencial">{typeLabels.presencial}</option>
                    <option value="salaFixa">{typeLabels.salaFixa}</option>
                    <option value="virtual">{typeLabels.virtual}</option>
                  </select>
                </div>

                <div className="client-line">
                  <span>📍</span>
                  <input 
                    className="inline-input" 
                    value={c.address || ""} 
                    placeholder="Endereço" 
                    onChange={(e) => onUpdate({ ...c, address: e.target.value })} 
                  />
                </div>

                <div className="client-line">
                  <span>📞</span>
                  <input 
                    className="inline-input" 
                    value={c.phone || ""} 
                    placeholder="Telefone" 
                    onChange={(e) => onUpdate({ ...c, phone: e.target.value })} 
                  />
                </div>

                <div className="client-line">
                  <span>✉️</span>
                  <input 
                    className="inline-input" 
                    value={c.email || ""} 
                    placeholder="E-mail" 
                    onChange={(e) => onUpdate({ ...c, email: e.target.value })} 
                  />
                </div>

                <div className="client-card-foot">
                  <div style={{ display: "flex", alignItems: "center", gap: "4px" }}>
                    <span className="muted">Desde:</span>
                    <input 
                      type="date" 
                      className="inline-input muted" 
                      value={c.since || ""} 
                      onChange={(e) => onUpdate({ ...c, since: e.target.value })} 
                    />
                  </div>
                  <button className="icon-btn ghost" onClick={() => onRemove(c.id)}>🗑</button>
                </div>
              </div>
            ))}
          </div>
        )}

        {showForm && (
          <Modal title="Novo cliente" onClose={() => setShowForm(false)}>
            <form onSubmit={submit}>
              <div className="field">
                <label>Nome / Razão social *</label>
                <input value={draft.name} onChange={(e) => setDraft({ ...draft, name: e.target.value })} placeholder="Ex.: Maria Souza" required autoFocus />
              </div>
              <div className="field">
                <label>CPF / CNPJ</label>
                <input value={draft.document} onChange={(e) => setDraft({ ...draft, document: e.target.value })} placeholder="000.000.000-00" />
              </div>
              <div className="field">
                <label>Endereço</label>
                <input value={draft.address} onChange={(e) => setDraft({ ...draft, address: e.target.value })} placeholder="Rua, número, bairro" />
              </div>
              <div className="field">
                <label>Tipo de Contrato</label>
                <div className="radio-row">
                  {Object.keys(typeLabels).map((t) => (
                    <label key={t} className={"radio-pill" + (draft.type === t ? " active" : "")}>
                      <input type="radio" checked={draft.type === t} onChange={() => setDraft({ ...draft, type: t })} />
                      {typeLabels[t]}
                    </label>
                  ))}
                </div>
              </div>
              <div className="form-row">
                <div className="field"><label>Telefone</label><input value={draft.phone} onChange={(e) => setDraft({ ...draft, phone: e.target.value })} placeholder="(24) 99999-9999" /></div>
                <div className="field"><label>E-mail</label><input value={draft.email} onChange={(e) => setDraft({ ...draft, email: e.target.value })} placeholder="cliente@email.com" /></div>
              </div>
              <button className="btn-primary full" type="submit">Cadastrar Cliente</button>
            </form>
          </Modal>
        )}
      </div>
    );
  }

  // --- FINANCEIRO COM MÁSCARA, GRÁFICO E EXPORTAÇÕES ---
  function Financeiro({ tx, onAdd, onUpdate, onRemove }) {
    const [showForm, setShowForm] = useState(false);
    const [draft, setDraft] = useState({ 
      type: "entrada", 
      desc: "", 
      maskedAmount: "", 
      date: new Date().toISOString().slice(0, 10), 
      category: "" 
    });

    const totals = useMemo(() => {
      const entradas = tx.filter((t) => t.type === "entrada").reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);
      const saidas = tx.filter((t) => t.type === "saida").reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);
      const saldo = entradas - saidas;
      const totalVolume = entradas + saidas;
      const percentEntradas = totalVolume > 0 ? (entradas / totalVolume) * 100 : 50;
      const percentSaidas = totalVolume > 0 ? (saidas / totalVolume) * 100 : 50;
      return { entradas, saidas, saldo, percentEntradas, percentSaidas, isPositivo: saldo >= 0 };
    }, [tx]);

    const submit = (e) => {
      e.preventDefault();
      const amount = parseMoneyToFloat(draft.maskedAmount);
      if (!draft.desc || isNaN(amount) || amount <= 0) return;
      onAdd({ 
        type: draft.type, 
        desc: draft.desc, 
        amount: amount, 
        date: draft.date, 
        category: draft.category, 
        id: uid("t_") 
      });
      setShowForm(false);
      setDraft({ type: "entrada", desc: "", maskedAmount: "", date: draft.date, category: "" });
    };

    const exportFinanceiroXLS = () => {
      const data = tx.map((t) => ({
        "Data": t.date ? t.date.split("-").reverse().join("/") : "",
        "Descrição": t.desc || "",
        "Categoria": t.category || "",
        "Tipo": t.type === "entrada" ? "Receita (+)" : "Despesa (-)",
        "Valor (R$)": parseFloat(t.amount || 0)
      }));

      data.push({});
      data.push({ "Descrição": "Total de Entradas", "Valor (R$)": totals.entradas });
      data.push({ "Descrição": "Total de Saídas", "Valor (R$)": totals.saidas });
      data.push({ "Descrição": "Saldo Acumulado", "Valor (R$)": totals.saldo });

      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Financeiro");
      XLSX.writeFile(wb, `Financeiro_Nellus_${new Date().toISOString().slice(0, 10)}.xlsx`);
    };

    const exportFinanceiroPDF = () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFont("helvetica", "bold");
      doc.setFontSize(16);
      doc.text("Nellus Coworking - Relatório Financeiro", 14, 18);
      
      doc.setFontSize(10);
      doc.setFont("helvetica", "normal");
      doc.text(`Data: ${new Date().toLocaleDateString("pt-BR")}`, 14, 25);
      doc.text(`Resumo: Entradas ${formatBRL(totals.entradas)} | Saídas ${formatBRL(totals.saidas)} | Saldo: ${formatBRL(totals.saldo)} (${totals.isPositivo ? "POSITIVO" : "NEGATIVO"})`, 14, 31);

      const tableData = tx
        .sort((a, b) => (b.date || "").localeCompare(a.date || ""))
        .map((t) => [
          t.date ? t.date.split("-").reverse().join("/") : "",
          t.desc || "",
          t.category || "",
          t.type === "entrada" ? "Entrada (+)" : "Saída (-)",
          formatBRL(t.amount)
        ]);

      doc.autoTable({
        head: [["Data", "Descrição", "Categoria", "Tipo", "Valor"]],
        body: tableData,
        startY: 36,
        theme: 'striped',
        headStyles: { fillColor: [14, 110, 86] },
        styles: { fontSize: 9, font: 'helvetica' }
      });

      doc.save(`Financeiro_Nellus_${new Date().toISOString().slice(0, 10)}.pdf`);
    };

    return (
      <div className="view">
        <div className="view-head">
          <div>
            <h2>Financeiro ({tx.length})</h2>
            <p>Controle financeiro e fluxo de caixa.</p>
          </div>
          <div className="btn-group">
            <button className="btn-primary outline" onClick={exportFinanceiroXLS}>📥 XLS</button>
            <button className="btn-primary outline" onClick={exportFinanceiroPDF}>📄 PDF</button>
            <button className="btn-primary" onClick={() => setShowForm(true)}>+ Novo lançamento</button>
          </div>
        </div>

        <div className="stat-row">
          <div className="stat-card">
            <span className="stat-label">Entradas</span>
            <strong className="stat-value up">{formatBRL(totals.entradas)}</strong>
          </div>
          <div className="stat-card">
            <span className="stat-label">Saídas</span>
            <strong className="stat-value down">{formatBRL(totals.saidas)}</strong>
          </div>
          <div className="stat-card">
            <span className="stat-label">Saldo Acumulado</span>
            <strong className={"stat-value " + (totals.isPositivo ? "up" : "down")}>{formatBRL(totals.saldo)}</strong>
          </div>
        </div>

        <div className="financial-chart-panel">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <span style={{ fontSize: "11px", textTransform: "uppercase", color: "var(--muted)", fontWeight: "bold" }}>Saúde Financeira</span>
              <h3 style={{ margin: "2px 0 0", fontFamily: "'Fraunces', serif" }}>Distribuição do Resultado</h3>
            </div>
            <span className={`financial-status-tag ${totals.isPositivo ? "positive" : "negative"}`}>
              {totals.isPositivo ? "● SALDO POSITIVO" : "● SALDO NEGATIVO"}
            </span>
          </div>

          <div className="progress-bar-container">
            <div className="progress-bar-fill in" style={{ width: `${totals.percentEntradas}%` }} />
            <div className="progress-bar-fill out" style={{ width: `${totals.percentSaidas}%` }} />
          </div>

          <div style={{ display: "flex", justifyContent: "space-between", fontSize: "12px", color: "var(--muted)" }}>
            <span>Receitas: {totals.percentEntradas.toFixed(1)}%</span>
            <span>Despesas: {totals.percentSaidas.toFixed(1)}%</span>
          </div>
        </div>

        <div className="tx-panel">
          <div className="chart-panel-head">
            <h3>Lançamentos</h3>
          </div>
          <div className="tx-list">
            {tx.length === 0 && <div className="empty-state">Nenhum lançamento registrado.</div>}
            {tx.map((t) => (
              <div className="tx-row" key={t.id}>
                <div className="tx-main">
                  <input 
                    className="inline-input" 
                    style={{ fontWeight: "bold" }} 
                    value={t.desc || ""} 
                    onChange={(e) => onUpdate({ ...t, desc: e.target.value })} 
                  />
                  <div className="tx-sub">
                    <input 
                      className="inline-input muted" 
                      placeholder="Categoria" 
                      value={t.category || ""} 
                      onChange={(e) => onUpdate({ ...t, category: e.target.value })} 
                    />
                    <span className="muted">•</span>
                    <input 
                      type="date" 
                      className="inline-input muted" 
                      value={t.date || ""} 
                      onChange={(e) => onUpdate({ ...t, date: e.target.value })} 
                    />
                  </div>
                </div>

                <select 
                  className="inline-select" 
                  value={t.type || "entrada"} 
                  onChange={(e) => onUpdate({ ...t, type: e.target.value })}
                >
                  <option value="entrada">Entrada (+)</option>
                  <option value="saida">Saída (-)</option>
                </select>

                <div style={{ width: "130px", textAlign: "right" }}>
                  <input 
                    type="text"
                    className={"inline-input " + (t.type === "entrada" ? "up" : "down")}
                    style={{ fontWeight: "bold", textAlign: "right" }}
                    value={formatBRL(t.amount)} 
                    onChange={(e) => {
                      const num = parseMoneyToFloat(e.target.value);
                      onUpdate({ ...t, amount: num });
                    }} 
                  />
                </div>

                <button className="icon-btn ghost" onClick={() => onRemove(t.id)}>🗑</button>
              </div>
            ))}
          </div>
        </div>

        {showForm && (
          <Modal title="Novo lançamento" onClose={() => setShowForm(false)}>
            <form onSubmit={submit}>
              <div className="radio-row">
                <label className={"radio-pill" + (draft.type === "entrada" ? " active" : "")}>
                  <input type="radio" checked={draft.type === "entrada"} onChange={() => setDraft({ ...draft, type: "entrada" })} /> Entrada
                </label>
                <label className={"radio-pill" + (draft.type === "saida" ? " active" : "")}>
                  <input type="radio" checked={draft.type === "saida"} onChange={() => setDraft({ ...draft, type: "saida" })} /> Saída
                </label>
              </div>
              <div className="field">
                <label>Descrição *</label>
                <input value={draft.desc} onChange={(e) => setDraft({ ...draft, desc: e.target.value })} required autoFocus />
              </div>
              <div className="form-row">
                <div className="field">
                  <label>Valor (R$) *</label>
                  <input 
                    type="text" 
                    placeholder="R$ 0,00"
                    value={draft.maskedAmount} 
                    onChange={(e) => setDraft({ ...draft, maskedAmount: maskMoneyInput(e.target.value) })} 
                    required 
                  />
                </div>
                <div className="field">
                  <label>Data</label>
                  <input type="date" value={draft.date} onChange={(e) => setDraft({ ...draft, date: e.target.value })} />
                </div>
              </div>
              <div className="field">
                <label>Categoria</label>
                <input value={draft.category} onChange={(e) => setDraft({ ...draft, category: e.target.value })} placeholder="Ex.: Mensalidade, Internet, Manutenção" />
              </div>
              <button className="btn-primary full" type="submit">Salvar Lançamento</button>
            </form>
          </Modal>
        )}
      </div>
    );
  }

  // --- COMPONENTE PRINCIPAL (SINCRONIZAÇÃO REST DIRETA) ---
  function NellusApp() {
    const [tab, setTab] = useState("clientes");
    const [statusMsg, setStatusMsg] = useState("Conectando...");
    
    const [clients, setClients] = useState(() => {
      try { return JSON.parse(localStorage.getItem("nellus_clients") || "[]"); } catch(e) { return []; }
    });
    const [bookings, setBookings] = useState(() => {
      try { return JSON.parse(localStorage.getItem("nellus_bookings") || "[]"); } catch(e) { return []; }
    });
    const [tx, setTx] = useState(() => {
      try { return JSON.parse(localStorage.getItem("nellus_tx") || "[]"); } catch(e) { return []; }
    });
    const [typeLabels, setTypeLabels] = useState(() => {
      try {
        return JSON.parse(localStorage.getItem("nellus_labels") || '{"presencial":"Presencial","salaFixa":"Sala fixa","virtual":"Escritório virtual"}');
      } catch(e) {
        return { presencial: "Presencial", salaFixa: "Sala fixa", virtual: "Escritório virtual" };
      }
    });

    // Função de sincronização com o banco pela API REST do Firebase
    const buscarDadosDaNuvem = async () => {
      try {
        const res = await fetch(`${DB_BASE_URL}.json`);
        if (!res.ok) {
          setStatusMsg("⚠️ Libere as Regras no Firebase");
          return;
        }
        const data = await res.json();
        if (data) {
          if (data.clients) {
            const list = Object.values(data.clients);
            setClients(list);
            localStorage.setItem("nellus_clients", JSON.stringify(list));
          }
          if (data.bookings) {
            const list = Object.values(data.bookings);
            setBookings(list);
            localStorage.setItem("nellus_bookings", JSON.stringify(list));
          }
          if (data.tx) {
            const list = Object.values(data.tx);
            setTx(list);
            localStorage.setItem("nellus_tx", JSON.stringify(list));
          }
          if (data.typeLabels) {
            setTypeLabels(data.typeLabels);
            localStorage.setItem("nellus_labels", JSON.stringify(data.typeLabels));
          }
        }
        setStatusMsg("🟢 Nuvem Conectada");
      } catch (err) {
        console.error("Erro na busca REST:", err);
        setStatusMsg("⚠️ Verifique a conexão");
      }
    };

    // Enviar dados para o banco
    const enviarParaNuvem = async (caminho, id, dados) => {
      setStatusMsg("⏳ Salvando...");
      try {
        if (dados === null) {
          await fetch(`${DB_BASE_URL}/${caminho}/${id}.json`, { method: "DELETE" });
        } else {
          await fetch(`${DB_BASE_URL}/${caminho}/${id}.json`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(dados)
          });
        }
        setStatusMsg("🟢 Salvo na Nuvem");
      } catch (err) {
        console.error("Erro ao salvar:", err);
        setStatusMsg("⚠️ Erro ao salvar na Nuvem");
      }
    };

    // Busca automática e polling para sincronizar entre aparelhos
    useEffect(() => {
      buscarDadosDaNuvem();
      const interval = setInterval(buscarDadosDaNuvem, 4000);
      return () => clearInterval(interval);
    }, []);

    // Handlers Clientes
    const handleAddClient = (novo) => {
      const atualizados = [...clients, novo];
      setClients(atualizados);
      localStorage.setItem("nellus_clients", JSON.stringify(atualizados));
      enviarParaNuvem("clients", novo.id, novo);
    };

    const handleUpdateClient = (item) => {
      const atualizados = clients.map((c) => (c.id === item.id ? item : c));
      setClients(atualizados);
      localStorage.setItem("nellus_clients", JSON.stringify(atualizados));
      enviarParaNuvem("clients", item.id, item);
    };

    const handleRemoveClient = (id) => {
      const atualizados = clients.filter((c) => c.id !== id);
      setClients(atualizados);
      localStorage.setItem("nellus_clients", JSON.stringify(atualizados));
      enviarParaNuvem("clients", id, null);
    };

    // Handlers Agenda
    const handleAddBooking = (novo) => {
      const atualizados = [...bookings, novo];
      setBookings(atualizados);
      localStorage.setItem("nellus_bookings", JSON.stringify(atualizados));
      enviarParaNuvem("bookings", novo.id, novo);
    };

    const handleUpdateBooking = (item) => {
      const atualizados = bookings.map((b) => (b.id === item.id ? item : b));
      setBookings(atualizados);
      localStorage.setItem("nellus_bookings", JSON.stringify(atualizados));
      enviarParaNuvem("bookings", item.id, item);
    };

    const handleRemoveBooking = (id) => {
      const atualizados = bookings.filter((b) => b.id !== id);
      setBookings(atualizados);
      localStorage.setItem("nellus_bookings", JSON.stringify(atualizados));
      enviarParaNuvem("bookings", id, null);
    };

    // Handlers Financeiro
    const handleAddTx = (novo) => {
      const atualizados = [...tx, novo];
      setTx(atualizados);
      localStorage.setItem("nellus_tx", JSON.stringify(atualizados));
      enviarParaNuvem("tx", novo.id, novo);
    };

    const handleUpdateTx = (item) => {
      const atualizados = tx.map((t) => (t.id === item.id ? item : t));
      setTx(atualizados);
      localStorage.setItem("nellus_tx", JSON.stringify(atualizados));
      enviarParaNuvem("tx", item.id, item);
    };

    const handleRemoveTx = (id) => {
      const atualizados = tx.filter((t) => t.id !== id);
      setTx(atualizados);
      localStorage.setItem("nellus_tx", JSON.stringify(atualizados));
      enviarParaNuvem("tx", id, null);
    };

    const handleUpdateLabels = async (labels) => {
      setTypeLabels(labels);
      localStorage.setItem("nellus_labels", JSON.stringify(labels));
      try {
        await fetch(`${DB_BASE_URL}/typeLabels.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(labels)
        });
      } catch(e) {}
    };

    return (
      <div className="nellus-app">
        <aside className="sidebar">
          <div className="brand">
            <div className="brand-text">
              <b>Nellus Coworking</b>
              <span>Gestão Centralizada</span>
              <span className="sync-status">{statusMsg}</span>
            </div>
          </div>
          <nav className="nav">
            <button className={"nav-item" + (tab === "agenda" ? " active" : "")} onClick={() => setTab("agenda")}>
              📅 Agenda
            </button>
            <button className={"nav-item" + (tab === "clientes" ? " active" : "")} onClick={() => setTab("clientes")}>
              👥 Clientes
            </button>
            <button className={"nav-item" + (tab === "financeiro" ? " active" : "")} onClick={() => setTab("financeiro")}>
              💳 Financeiro
            </button>
          </nav>
          <div className="sidebar-foot">
            <b>Nellus Gestão</b><br />
            Sincronização em tempo real via nuvem.
          </div>
        </aside>

        <main className="main">
          {tab === "agenda" && (
            <Agenda
              bookings={bookings}
              clients={clients}
              onAdd={handleAddBooking}
              onUpdate={handleUpdateBooking}
              onRemove={handleRemoveBooking}
            />
          )}
          {tab === "clientes" && (
            <Clientes
              clients={clients}
              typeLabels={typeLabels}
              setTypeLabels={handleUpdateLabels}
              onAdd={handleAddClient}
              onUpdate={handleUpdateClient}
              onRemove={handleRemoveClient}
            />
          )}
          {tab === "financeiro" && (
            <Financeiro
              tx={tx}
              onAdd={handleAddTx}
              onUpdate={handleUpdateTx}
              onRemove={handleRemoveTx}
            />
          )}
        </main>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<NellusApp />);
</script>

</body>
</html>
