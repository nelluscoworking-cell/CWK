<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nellus Coworking - Gestão Integrada</title>
  
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Bibliotecas de Exportação XLS e PDF -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap');

    :root {
      --ink: #1B2420;
      --muted: #8A8578;
      --paper: #F7F5F0;
      --surface: #FFFFFF;
      --border: #E4DFD3;
      --teal: #0E6E56;
      --teal-deep: #0A4F3E;
      --orange: #E08A52;
      --orange-deep: #C96B34;
      --up: #1F9D6C;
      --down: #C1483B;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: #EFEAE0;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .nellus-app {
      color: var(--ink);
      background: var(--paper);
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 800px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    .nellus-app * { box-sizing: border-box; }

    /* Trava de Rotação (Aviso para forçar Horizontal) */
    .rotate-warning { display: none; }
    
    @media screen and (max-width: 900px) and (orientation: portrait) {
      .nellus-app { display: none !important; }
      .rotate-warning {
        display: flex; flex-direction: column; position: fixed; inset: 0;
        background: var(--teal-deep); color: #EFEAE0;
        align-items: center; justify-content: center; text-align: center;
        font-size: 22px; font-weight: 600; padding: 30px; font-family: 'Fraunces', serif; z-index: 9999;
      }
    }

    @media (max-width: 800px) {
      .nellus-app { grid-template-columns: 1fr; }
    }

    .sidebar {
      background: linear-gradient(180deg, var(--teal-deep), #08392C 85%);
      color: #EFEAE0;
      padding: 26px 18px;
      display: flex;
      flex-direction: column;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 28px; }
    .brand-text { display: flex; flex-direction: column; line-height: 1.1; }
    .brand-text b { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; }
    .brand-text span { font-size: 11.5px; color: #B9CFC5; }

    .nav { display: flex; flex-direction: column; gap: 4px; }
    .nav-item {
      display: flex; align-items: center; gap: 11px;
      padding: 10px 12px; border-radius: 10px;
      background: transparent; border: none; cursor: pointer;
      color: #D8E6DE; font-family: inherit; font-size: 14.5px; font-weight: 500;
      text-align: left; transition: background 0.15s ease, color 0.15s ease;
    }
    .nav-item:hover { background: rgba(255,255,255,0.06); }
    .nav-item.active { background: var(--orange); color: #1B2420; font-weight: 600; }

    .sidebar-foot {
      margin-top: auto; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.12);
      font-size: 12px; color: #9FC2B2; line-height: 1.5;
    }
    .sidebar-foot b { color: #EFEAE0; font-size: 13px; }

    .main { padding: 28px 32px 32px; overflow-y: auto; max-width: calc(100vw - 240px); }
    .view-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
    .view-head h2 { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600; margin: 0 0 4px; }
    .view-head p { margin: 0; color: var(--muted); font-size: 13.5px; }

    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center;}

    .btn-primary {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--orange); color: #23140A; border: none;
      padding: 9px 15px; border-radius: 10px; font-family: inherit;
      font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap;
      transition: all 0.15s;
    }
    .btn-primary:hover { background: var(--orange-deep); color: #fff; }
    .btn-primary.outline { background: #FFFFFF; border: 1px solid var(--border); color: var(--ink); }
    .btn-primary.outline:hover { background: #EAE5D9; }
    .btn-primary.full { width: 100%; justify-content: center; margin-top: 8px; }

    .icon-btn {
      border: none; background: var(--surface); border: 1px solid var(--border);
      width: 32px; height: 32px; border-radius: 8px; display: flex;
      align-items: center; justify-content: center; cursor: pointer; color: var(--ink);
    }
    .icon-btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
    .icon-btn.ghost:hover { background: #F1ECE1; color: var(--down); }

    .inline-input {
      border: 1px solid transparent; background: transparent;
      font-family: inherit; font-size: inherit; color: inherit;
      padding: 3px 6px; border-radius: 6px; width: 100%;
    }
    .inline-input:hover { border-color: var(--border); background: #FFFFFF; }
    .inline-input:focus { border-color: var(--teal); background: #FFFFFF; outline: none; }

    .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; margin-bottom: 12px; }
    .field input, .field select {
      padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border);
      font-family: inherit; font-size: 13.5px; outline: none; background: #fff; width: 100%;
    }
    .field input:focus, .field select:focus { border-color: var(--teal); }
    .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }

    .modal-veil {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .modal {
      background: var(--surface); border-radius: 14px; width: 100%; max-width: 500px;
      padding: 22px 24px; border: 1px solid var(--border); box-shadow: 0 12px 32px rgba(0,0,0,0.15);
      max-height: 90vh; overflow-y: auto;
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .modal-head h3 { font-family: 'Fraunces', serif; margin: 0; font-size: 20px; }

    /* Estilos de Planilha (Tabela) */
    .table-wrapper {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      overflow-x: auto; width: 100%; max-height: 65vh; overflow-y: auto;
    }
    .spreadsheet-table { width: 100%; border-collapse: collapse; font-size: 12.5px; text-align: left; }
    .spreadsheet-table th {
      background: #EAE5D9; padding: 10px 12px; font-weight: 700; color: var(--teal-deep);
      border-bottom: 1px solid var(--border); border-right: 1px solid var(--border);
      white-space: nowrap; position: sticky; top: 0; z-index: 10;
    }
    .spreadsheet-table td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); padding: 0; min-width: 140px; }
    .spreadsheet-table td.actions { min-width: 50px; text-align: center; padding: 0 5px; }
    .spreadsheet-table input {
      width: 100%; border: none; padding: 12px 10px; background: transparent;
      font-family: inherit; font-size: inherit; outline: none; box-sizing: border-box;
    }
    .spreadsheet-table input:focus { background: rgba(14, 110, 86, 0.05); }

    .add-row-btn {
      width: 100%; padding: 12px; border: none; background: #F7F5F0; font-family: inherit;
      font-weight: 600; color: var(--teal-deep); cursor: pointer; text-align: left;
      border-radius: 0 0 12px 12px; transition: background 0.1s;
    }
    .add-row-btn:hover { background: #EFEAE0; }

    /* Agenda Styles */
    .agenda-month-picker { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; background: var(--surface); padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); width: fit-content; }
    .agenda-month-picker label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
    .agenda-month-picker input { border: 1px solid var(--border); padding: 5px 8px; border-radius: 6px; font-family: inherit; font-size: 13px; }
    .date-rail-wrapper { overflow-x: auto; padding-bottom: 8px; margin-bottom: 18px; }
    .date-rail { display: flex; gap: 6px; flex-wrap: nowrap; min-width: max-content; }
    .date-chip { border: 1px solid var(--border); background: var(--surface); color: var(--ink); padding: 6px 12px; border-radius: 20px; font-size: 12.5px; cursor: pointer; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .date-chip .day-week { font-size: 10px; text-transform: uppercase; color: var(--muted); }
    .date-chip.active { background: var(--teal); border-color: var(--teal); color: #fff; }
    .date-chip.active .day-week { color: #D8E6DE; }
    .date-chip.has-booking { border-bottom: 3px solid var(--orange); }
    .agenda-list { display: flex; flex-direction: column; gap: 10px; }
    .agenda-row { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; }
    .agenda-time { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); width: 175px; flex-shrink: 0; }
    .agenda-main { display: flex; flex-direction: column; flex: 1; gap: 2px; }

    .sync-status { font-size: 11px; padding: 4px 9px; border-radius: 12px; background: rgba(255,255,255,0.18); display: inline-block; margin-top: 6px; font-weight: 600; }
  </style>
</head>
<body>

<div id="rotate-message" class="rotate-warning">
  <div style="font-size: 40px; margin-bottom: 10px;">🔄</div>
  Por favor, vire o seu celular na horizontal (deitado) para utilizar o aplicativo de forma otimizada.
</div>

<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect, useMemo } = React;

  const DB_BASE_URL = "https://nellus-gestao-default-rtdb.firebaseio.com/nellus";

  function uid(p) { return p + Math.random().toString(36).slice(2, 8); }

  function Modal({ title, onClose, children }) {
    return (
      <div className="modal-veil" onClick={(e) => e.target === e.currentTarget && onClose()}>
        <div className="modal">
          <div className="modal-head">
            <h3>{title}</h3>
            <button className="icon-btn" onClick={onClose}>✕</button>
          </div>
          {children}
        </div>
      </div>
    );
  }

  // --- Célula Inteligente (Salva no Firebase ao sair do campo e Suporta Datalist) ---
  function CellInput({ value, type, list, onSave }) {
      const [val, setVal] = useState(value || "");
      
      useEffect(() => { setVal(value || ""); }, [value]);

      return (
         <input 
            type={type === 'date' ? 'date' : type === 'time' ? 'time' : 'text'}
            list={list}
            value={val}
            onChange={e => setVal(e.target.value)}
            onBlur={() => {
                if (val !== (value || "")) {
                    onSave(val);
                }
            }}
            placeholder="..."
         />
      );
  }

  // --- GERADOR DE PLANILHAS (VISUAL EXCEL) ---
  function SpreadsheetView({ title, description, data, fields, onAdd, onUpdate, onRemove }) {
     const exportXLS = () => {
        const exportData = data.map(item => {
           let row = {};
           fields.forEach(f => { row[f.label] = item[f.name] || ""; });
           return row;
        });
        const ws = XLSX.utils.json_to_sheet(exportData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, title.substring(0, 30));
        XLSX.writeFile(wb, `${title}_Nellus.xlsx`);
     };

     const addNewRow = () => {
         const newRow = { id: uid("r_") };
         onAdd(newRow);
     };

     return (
        <div className="view">
          <div className="view-head">
            <div>
              <h2>{title} ({data.length})</h2>
              <p>{description}</p>
            </div>
            <div className="btn-group">
              <button className="btn-primary outline" onClick={exportXLS}>📥 Exportar Planilha</button>
            </div>
          </div>

          <div className="table-wrapper">
             <table className="spreadsheet-table">
                <thead>
                   <tr>
                      <th className="actions"></th>
                      {fields.map(f => <th key={f.name}>{f.label}</th>)}
                   </tr>
                </thead>
                <tbody>
                   {data.map(item => (
                      <tr key={item.id}>
                         <td className="actions">
                            <button className="icon-btn ghost" style={{width:'24px', height:'24px'}} onClick={() => { if(window.confirm("Excluir esta linha inteira?")) onRemove(item.id); }}>🗑</button>
                         </td>
                         {fields.map(f => (
                            <td key={f.name}>
                               <CellInput 
                                  value={item[f.name]} 
                                  type={f.type} 
                                  list={f.suggest ? "client-list" : undefined}
                                  onSave={(newValue) => onUpdate({ ...item, [f.name]: newValue })} 
                               />
                            </td>
                         ))}
                      </tr>
                   ))}
                </tbody>
             </table>
             <button className="add-row-btn" onClick={addNewRow}>+ Preencher nova linha abaixo</button>
          </div>
        </div>
     );
  }

  // --- CONFIGURAÇÃO EXATA DAS COLUNAS DA SUA PLANILHA ---
  const virtualFields = [
    { name: 'cliente', label: 'CLIENTE' },
    { name: 'cpf', label: 'CPF' },
    { name: 'email', label: 'EMAIL' },
    { name: 'contato', label: 'CONTATO' },
    { name: 'razaoSocial', label: 'RAZÃO SOCIAL' },
    { name: 'cnpj', label: 'CNPJ' },
    { name: 'dataEntrada', label: 'DATA DE ENTRADA', type: 'date' },
    { name: 'formaPagamento', label: 'FORMA DE PAGAMENTO' },
  ];

  const presencialFields = [
    { name: 'cnpj', label: 'CNPJ' },
    { name: 'razaoSocial', label: 'RAZÃO SOCIAL' },
    { name: 'porte', label: 'PORTE EMPRESARIAL' },
    { name: 'cpf', label: 'CPF' },
    { name: 'rg', label: 'RG' },
    { name: 'dataNascimento', label: 'DATA NASCIMENTO', type: 'date' },
    { name: 'responsavel', label: 'CLIENTE/RESP. LEGAL' },
    { name: 'atividade', label: 'ATIVIDADE' },
    { name: 'servicoEmpresa', label: 'A SERVIÇO DA EMPRESA' },
    { name: 'telefone', label: 'TELEFONE' },
    { name: 'email', label: 'E-MAIL' },
    { name: 'logradouro', label: 'LOGRADOURO' },
    { name: 'cep', label: 'CEP' },
    { name: 'bairro', label: 'BAIRRO' },
    { name: 'cidade', label: 'CIDADE' },
    { name: 'uf', label: 'UF' },
    { name: 'servico', label: 'SERVIÇO' },
    { name: 'inicio', label: 'INÍCIO', type: 'date' },
    { name: 'termino', label: 'TÉRMINO', type: 'date' },
    { name: 'contrato', label: 'Nº CONTRATO' },
  ];

  const vendasFields = [
    { name: 'data', label: 'DATA', type: 'date' },
    { name: 'diaSemana', label: 'DIA SEMANA' },
    { name: 'novoCliente', label: 'NOVO CLIENTE' },
    { name: 'propaganda', label: 'PROPAGANDA' },
    { name: 'clienteCnpj', label: 'CLIENTE - CNPJ', suggest: true }, // Adicionado Sugestão
    { name: 'clienteCpf', label: 'CLIENTE - CPF (Nome)', suggest: true }, // Adicionado Sugestão
    { name: 'contratacao', label: 'CONTRATAÇÃO' },
    { name: 'tipoServico', label: 'TIPO DE SERVIÇO' },
    { name: 'preco', label: 'PREÇO' },
    { name: 'inicio', label: 'INICIO', type: 'time' },
    { name: 'termino', label: 'TÉRMINO', type: 'time' },
    { name: 'totalHoras', label: 'TOTAL HORAS' },
    { name: 'valorPagar', label: 'VALOR A PAGAR' },
    { name: 'nf', label: 'N° NF' },
    { name: 'pagamento', label: 'PAGAMENTO' },
    { name: 'banco', label: 'BANCO' },
  ];

  // --- AGENDA MANTIDA INTACTA COM AUTO-COMPLETAR ---
  function Agenda({ bookings, onAdd, onUpdate, onRemove }) {
    const todayStr = new Date().toISOString().slice(0, 10);
    const [currentMonth, setCurrentMonth] = useState(todayStr.slice(0, 7));
    const [activeDate, setActiveDate] = useState(todayStr);
    const [showForm, setShowForm] = useState(false);
    const [draft, setDraft] = useState({ clientName: "", date: todayStr, start: "09:00", end: "10:00", room: "", notes: "" });

    const daysInMonth = useMemo(() => {
      const [year, month] = currentMonth.split("-").map(Number);
      const lastDay = new Date(year, month, 0).getDate();
      const list = [];
      for (let d = 1; d <= lastDay; d++) {
        const dd = String(d).padStart(2, "0");
        const fullDate = `${year}-${String(month).padStart(2, "0")}-${dd}`;
        const dateObj = new Date(year, month - 1, d);
        const weekDay = dateObj.toLocaleDateString("pt-BR", { weekday: "short" }).replace(".", "");
        list.push({ date: fullDate, day: dd, weekDay });
      }
      return list;
    }, [currentMonth]);

    const dayBookings = bookings
      .filter((b) => b.date === activeDate)
      .sort((a, b) => (a.start || "").localeCompare(b.start || ""));

    const submit = (e) => {
      e.preventDefault();
      if (!draft.clientName || !draft.room) return;
      onAdd({ ...draft, id: uid("b_") });
      setShowForm(false);
    };

    return (
      <div className="view">
        <div className="view-head">
          <div>
            <h2>Agenda ({bookings.length})</h2>
            <p>Reservas centralizadas com visualização do mês inteiro.</p>
          </div>
          <div className="btn-group">
            <button className="btn-primary" onClick={() => {
              setDraft({ clientName: "", date: activeDate, start: "09:00", end: "10:00", room: "", notes: "" });
              setShowForm(true);
            }}>+ Novo agendamento rápido</button>
          </div>
        </div>

        <div className="agenda-month-picker">
          <label>Selecione o Mês:</label>
          <input type="month" value={currentMonth} onChange={(e) => { setCurrentMonth(e.target.value); setActiveDate(`${e.target.value}-01`); }} />
        </div>

        <div className="date-rail-wrapper">
          <div className="date-rail">
            {daysInMonth.map((d) => {
              const hasBooking = bookings.some((b) => b.date === d.date);
              return (
                <button key={d.date} className={`date-chip ${d.date === activeDate ? "active" : ""} ${hasBooking ? "has-booking" : ""}`} onClick={() => setActiveDate(d.date)}>
                  <span className="day-week">{d.weekDay}</span><strong>{d.day}</strong>
                </button>
              );
            })}
          </div>
        </div>

        <div className="agenda-list">
          <div style={{ fontSize: "14px", fontWeight: "600", color: "var(--teal-deep)", marginBottom: "4px" }}>
            Agendamentos para {activeDate.split("-").reverse().join("/")}:
          </div>
          {dayBookings.length === 0 && <div className="empty-state">Nenhum agendamento para este dia.</div>}
          {dayBookings.map((b) => (
            <div className="agenda-row" key={b.id}>
              <div className="agenda-time">
                <span>⏱</span>
                <input type="time" className="inline-input" style={{width:'auto'}} value={b.start || ""} onChange={(e) => onUpdate({ ...b, start: e.target.value })} />
                <span>–</span>
                <input type="time" className="inline-input" style={{width:'auto'}} value={b.end || ""} onChange={(e) => onUpdate({ ...b, end: e.target.value })} />
              </div>
              <div className="agenda-main">
                <input className="inline-input" style={{ fontWeight: "bold" }} list="client-list" placeholder="Nome do Cliente..." value={b.clientName || ""} onChange={(e) => onUpdate({ ...b, clientName: e.target.value })} />
                <div style={{ display: "flex", gap: "8px" }}>
                  <input className="inline-input muted" placeholder="Espaço/Sala..." value={b.room || ""} onChange={(e) => onUpdate({ ...b, room: e.target.value })} />
                  <input className="inline-input muted" placeholder="Observações..." value={b.notes || ""} onChange={(e) => onUpdate({ ...b, notes: e.target.value })} />
                </div>
              </div>
              <button className="icon-btn ghost" onClick={() => onRemove(b.id)}>🗑</button>
            </div>
          ))}
        </div>

        {showForm && (
          <Modal title="Novo agendamento" onClose={() => setShowForm(false)}>
            <form onSubmit={submit}>
              <div className="field">
                <label>Cliente</label>
                <input list="client-list" value={draft.clientName} onChange={(e) => setDraft({ ...draft, clientName: e.target.value })} placeholder="Nome do cliente" required autoFocus />
              </div>
              <div className="form-row">
                <div className="field"><label>Data</label><input type="date" value={draft.date} onChange={(e) => setDraft({ ...draft, date: e.target.value })} /></div>
                <div className="field"><label>Início</label><input type="time" value={draft.start} onChange={(e) => setDraft({ ...draft, start: e.target.value })} /></div>
                <div className="field"><label>Fim</label><input type="time" value={draft.end} onChange={(e) => setDraft({ ...draft, end: e.target.value })} /></div>
              </div>
              <div className="field"><label>Espaço / Estação</label><input placeholder="Ex.: Sala de Reunião, Estação 3" value={draft.room} onChange={(e) => setDraft({ ...draft, room: e.target.value })} required /></div>
              <div className="field"><label>Observações</label><input value={draft.notes} onChange={(e) => setDraft({ ...draft, notes: e.target.value })} /></div>
              <button className="btn-primary full" type="submit">Salvar Agendamento</button>
            </form>
          </Modal>
        )}
      </div>
    );
  }

  // --- COMPONENTE PRINCIPAL ---
  function NellusApp() {
    const [tab, setTab] = useState("agenda");
    const [statusMsg, setStatusMsg] = useState("Conectando...");
    
    const [bookings, setBookings] = useState(() => { try { return JSON.parse(localStorage.getItem("nellus_bookings") || "[]"); } catch(e) { return []; } });
    const [clientesVirtual, setClientesVirtual] = useState([]);
    const [clientesPresencial, setClientesPresencial] = useState([]);
    const [vendas, setVendas] = useState([]);

    const buscarDadosDaNuvem = async () => {
      try {
        const res = await fetch(`${DB_BASE_URL}.json`);
        if (!res.ok) { setStatusMsg("⚠️ Erro de Permissão"); return; }
        const data = await res.json();
        if (data) {
          if (data.bookings) {
            const list = Object.values(data.bookings);
            setBookings(list);
            localStorage.setItem("nellus_bookings", JSON.stringify(list));
          }
          if (data.clientesVirtual) setClientesVirtual(Object.values(data.clientesVirtual));
          if (data.clientesPresencial) setClientesPresencial(Object.values(data.clientesPresencial));
          if (data.vendas) setVendas(Object.values(data.vendas));
        }
        setStatusMsg("🟢 Nuvem Conectada");
      } catch (err) { setStatusMsg("⚠️ Verifique a conexão"); }
    };

    const enviarParaNuvem = async (caminho, id, dados) => {
      setStatusMsg("⏳ Salvando...");
      try {
        if (dados === null) await fetch(`${DB_BASE_URL}/${caminho}/${id}.json`, { method: "DELETE" });
        else await fetch(`${DB_BASE_URL}/${caminho}/${id}.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(dados) });
        setStatusMsg("🟢 Salvo na Nuvem");
      } catch (err) { setStatusMsg("⚠️ Erro ao salvar"); }
    };

    useEffect(() => {
      buscarDadosDaNuvem();
      const interval = setInterval(buscarDadosDaNuvem, 5000);
      return () => clearInterval(interval);
    }, []);

    const crudHandler = (stateSetter, collectionName) => ({
      add: (novo) => { stateSetter(prev => [...prev, novo]); enviarParaNuvem(collectionName, novo.id, novo); },
      update: (item) => { stateSetter(prev => prev.map(i => i.id === item.id ? item : i)); enviarParaNuvem(collectionName, item.id, item); },
      remove: (id) => { stateSetter(prev => prev.filter(i => i.id !== id)); enviarParaNuvem(collectionName, id, null); }
    });

    const hBookings = crudHandler(setBookings, "bookings");
    const hVirtual = crudHandler(setClientesVirtual, "clientesVirtual");
    const hPresencial = crudHandler(setClientesPresencial, "clientesPresencial");
    const hVendas = crudHandler(setVendas, "vendas");

    // Lógica para Auto-completar Clientes (Busca os nomes já cadastrados nas planilhas)
    const allClientNames = useMemo(() => {
      const names = new Set();
      clientesVirtual.forEach(c => {
        if (c.cliente) names.add(c.cliente);
        if (c.razaoSocial) names.add(c.razaoSocial);
      });
      clientesPresencial.forEach(c => {
        if (c.responsavel) names.add(c.responsavel);
        if (c.razaoSocial) names.add(c.razaoSocial);
      });
      return Array.from(names).filter(Boolean).sort();
    }, [clientesVirtual, clientesPresencial]);

    return (
      <div className="nellus-app">
        {/* Renderiza a lista de auto-completar na raiz para ficar disponível no app todo */}
        <datalist id="client-list">
          {allClientNames.map(name => <option key={name} value={name} />)}
        </datalist>

        <aside className="sidebar">
          <div className="brand">
            <div className="brand-text">
              <b>Nellus Coworking</b>
              <span>Gestão Centralizada</span>
              <span className="sync-status">{statusMsg}</span>
            </div>
          </div>
          <nav className="nav">
            <button className={"nav-item" + (tab === "agenda" ? " active" : "")} onClick={() => setTab("agenda")}>
              📅 Agenda
            </button>
            <button className={"nav-item" + (tab === "virtual" ? " active" : "")} onClick={() => setTab("virtual")}>
              💻 Escritório Virtual
            </button>
            <button className={"nav-item" + (tab === "presencial" ? " active" : "")} onClick={() => setTab("presencial")}>
              🏢 Cliente Presencial
            </button>
            <button className={"nav-item" + (tab === "vendas" ? " active" : "")} onClick={() => setTab("vendas")}>
              💰 Vendas
            </button>
          </nav>
          <div className="sidebar-foot">
            <b>Vercel + Firebase</b><br />
            Digitação direta e salvamento automático.
          </div>
        </aside>

        <main className="main">
          {tab === "agenda" && (
            <Agenda bookings={bookings} onAdd={hBookings.add} onUpdate={hBookings.update} onRemove={hBookings.remove} />
          )}
          {tab === "virtual" && (
             <SpreadsheetView 
                title="Escritório Virtual" 
                description="Planilha editável: preencha e o app salva automaticamente ao sair da célula."
                data={clientesVirtual} fields={virtualFields}
                onAdd={hVirtual.add} onUpdate={hVirtual.update} onRemove={hVirtual.remove} 
             />
          )}
          {tab === "presencial" && (
             <SpreadsheetView 
                title="Clientes Presenciais" 
                description="Planilha editável: preencha e o app salva automaticamente ao sair da célula."
                data={clientesPresencial} fields={presencialFields}
                onAdd={hPresencial.add} onUpdate={hPresencial.update} onRemove={hPresencial.remove} 
             />
          )}
          {tab === "vendas" && (
             <SpreadsheetView 
                title="Vendas" 
                description="Planilha editável: preencha e o app salva automaticamente ao sair da célula."
                data={vendas} fields={vendasFields}
                onAdd={hVendas.add} onUpdate={hVendas.update} onRemove={hVendas.remove} 
             />
          )}
        </main>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<NellusApp />);
</script>

</body>
</html>
