<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nellus Coworking - Gestão Integrada</title>
  
  <!-- React & Babel (Versões Otimizadas para Produção) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Bibliotecas de Exportação XLS e PDF (Carregamento em Segundo Plano "defer") -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js" defer></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap');

    :root {
      --ink: #1B2420;
      --muted: #8A8578;
      --paper: #F7F5F0;
      --surface: #FFFFFF;
      --border: #E4DFD3;
      --teal: #0E6E56;
      --teal-deep: #0A4F3E;
      --orange: #E08A52;
      --orange-deep: #C96B34;
      --up: #1F9D6C;
      --down: #C1483B;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: #EFEAE0;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .nellus-app {
      color: var(--ink);
      background: var(--paper);
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 800px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    .nellus-app * { box-sizing: border-box; }

    @media (max-width: 800px) {
      .nellus-app { grid-template-columns: 1fr; }
    }

    .sidebar {
      background: linear-gradient(180deg, var(--teal-deep), #08392C 85%);
      color: #EFEAE0;
      padding: 26px 18px;
      display: flex;
      flex-direction: column;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 28px; }
    .brand-text { display: flex; flex-direction: column; line-height: 1.1; }
    .brand-text b { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; }
    .brand-text span { font-size: 11.5px; color: #B9CFC5; }

    .nav { display: flex; flex-direction: column; gap: 4px; }
    .nav-item {
      display: flex; align-items: center; gap: 11px;
      padding: 10px 12px; border-radius: 10px;
      background: transparent; border: none; cursor: pointer;
      color: #D8E6DE; font-family: inherit; font-size: 14.5px; font-weight: 500;
      text-align: left; transition: background 0.15s ease, color 0.15s ease;
    }
    .nav-item:hover { background: rgba(255,255,255,0.06); }
    .nav-item.active { background: var(--orange); color: #1B2420; font-weight: 600; }

    .sidebar-foot {
      margin-top: auto; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.12);
      font-size: 12px; color: #9FC2B2; line-height: 1.5;
    }
    .sidebar-foot b { color: #EFEAE0; font-size: 13px; }

    .main { padding: 28px 32px 32px; overflow-y: auto; max-width: calc(100vw - 240px); }
    .view-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
    .view-head h2 { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600; margin: 0 0 4px; }
    .view-head p { margin: 0; color: var(--muted); font-size: 13.5px; }

    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center;}

    .btn-primary {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--orange); color: #23140A; border: none;
      padding: 9px 15px; border-radius: 10px; font-family: inherit;
      font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap;
      transition: all 0.15s;
    }
    .btn-primary:hover { background: var(--orange-deep); color: #fff; }
    .btn-primary.outline { background: #FFFFFF; border: 1px solid var(--border); color: var(--ink); }
    .btn-primary.outline:hover { background: #EAE5D9; }
    .btn-primary.full { width: 100%; justify-content: center; margin-top: 8px; }
    .btn-primary.danger { background: #FDEEEC; color: var(--down); border: 1px solid #F5C6C1; }
    .btn-primary.danger:hover { background: var(--down); color: #fff; }

    .icon-btn {
      border: none; background: var(--surface); border: 1px solid var(--border);
      width: 32px; height: 32px; border-radius: 8px; display: flex;
      align-items: center; justify-content: center; cursor: pointer; color: var(--ink);
    }
    .icon-btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
    .icon-btn.ghost:hover { background: #F1ECE1; color: var(--down); }

    .inline-input, .inline-select {
      border: 1px solid transparent; background: transparent;
      font-family: inherit; font-size: inherit; color: inherit;
      padding: 3px 6px; border-radius: 6px; width: 100%;
    }
    .inline-input:hover, .inline-select:hover { border-color: var(--border); background: #FFFFFF; }
    .inline-input:focus, .inline-select:focus { border-color: var(--teal); background: #FFFFFF; outline: none; }

    .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; margin-bottom: 12px; }
    .field input, .field select {
      padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border);
      font-family: inherit; font-size: 13.5px; outline: none; background: #fff; width: 100%; box-sizing: border-box;
    }
    .field input:focus, .field select:focus { border-color: var(--teal); }
    .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }

    .modal-veil {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .modal {
      background: var(--surface); border-radius: 14px; width: 100%; max-width: 500px;
      padding: 22px 24px; border: 1px solid var(--border); box-shadow: 0 12px 32px rgba(0,0,0,0.15);
      max-height: 90vh; overflow-y: auto;
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .modal-head h3 { font-family: 'Fraunces', serif; margin: 0; font-size: 20px; }

    /* Estilos de Planilha (Tabela) */
    .table-wrapper {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      overflow-x: auto; width: 100%; max-height: 65vh; overflow-y: auto;
    }
    .spreadsheet-table { width: 100%; border-collapse: collapse; font-size: 12.5px; text-align: left; }
    .spreadsheet-table th {
      background: #EAE5D9; padding: 10px 12px; font-weight: 700; color: var(--teal-deep);
      border-bottom: 1px solid var(--border); border-right: 1px solid var(--border);
      white-space: nowrap; position: sticky; top: 0; z-index: 10;
    }
    .spreadsheet-table td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); padding: 0; min-width: 140px; }
    .spreadsheet-table td.actions { min-width: 30px; text-align: center; padding: 0 5px; }
    .spreadsheet-table input.cell-input {
      width: 100%; border: none; padding: 12px 10px; background: transparent;
      font-family: inherit; font-size: inherit; outline: none; box-sizing: border-box;
    }
    .spreadsheet-table input.cell-input:focus { background: rgba(14, 110, 86, 0.05); }
    
    .checkbox-cell {
      width: 18px; height: 18px; cursor: pointer; accent-color: var(--teal);
    }

    .add-row-btn {
      width: 100%; padding: 12px; border: none; background: #F7F5F0; font-family: inherit;
      font-weight: 600; color: var(--teal-deep); cursor: pointer; text-align: left;
      border-radius: 0 0 12px 12px; transition: background 0.1s;
    }
    .add-row-btn:hover { background: #EFEAE0; }

    /* Toast de Desfazer */
    .toast-undo {
      position: fixed; bottom: 30px; right: 30px; background: var(--ink); color: #fff;
      padding: 14px 20px; border-radius: 12px; display: flex; align-items: center; gap: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 9999;
      animation: slideUp 0.3s ease; font-size: 14px;
    }
    .toast-undo button {
      background: var(--orange); color: var(--ink); border: none; padding: 8px 16px;
      border-radius: 8px; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .toast-undo button:hover { background: var(--orange-deep); color: #fff; }
    @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* Agenda Styles */
    .agenda-month-picker { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; background: var(--surface); padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); width: fit-content; }
    .agenda-month-picker label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
    .agenda-month-picker input { border: 1px solid var(--border); padding: 5px 8px; border-radius: 6px; font-family: inherit; font-size: 13px; }
    .date-rail-wrapper { overflow-x: auto; padding-bottom: 8px; margin-bottom: 18px; }
    .date-rail { display: flex; gap: 6px; flex-wrap: nowrap; min-width: max-content; }
    .date-chip { border: 1px solid var(--border); background: var(--surface); color: var(--ink); padding: 6px 12px; border-radius: 20px; font-size: 12.5px; cursor: pointer; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .date-chip .day-week { font-size: 10px; text-transform: uppercase; color: var(--muted); }
    .date-chip.active { background: var(--teal); border-color: var(--teal); color: #fff; }
    .date-chip.active .day-week { color: #D8E6DE; }
    .date-chip.has-booking { border-bottom: 3px solid var(--orange); }
    .agenda-list { display: flex; flex-direction: column; gap: 10px; }
    .agenda-row { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; }
    .agenda-time { display: flex; align-items: center; gap: 4px; font-size: 14px; color: var(--ink); width: 185px; flex-shrink: 0; font-weight: 800; }
    .agenda-main { display: flex; flex-direction: column; flex: 1; gap: 4px; }

    .sync-status { font-size: 11px; padding: 4px 9px; border-radius: 12px; background: rgba(255,255,255,0.18); display: inline-block; margin-top: 6px; font-weight: 600; }
    
    /* Tela de Login & Loading Inicial */
    .login-container {
      display: flex; align-items: center; justify-content: center; 
      min-height: 100vh; background: var(--teal-deep); padding: 20px;
    }
    .login-box {
      background: var(--surface); padding: 40px; border-radius: 20px; 
      width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .initial-loader {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; background-color: var(--teal-deep); color: #EFEAE0; width: 100vw; position: fixed; top: 0; left: 0;
    }
    .spinner {
      width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.2);
      border-top-color: var(--orange); border-radius: 50%;
      animation: spin 1s linear infinite; margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="root">
  <div class="initial-loader">
    <div class="spinner"></div>
    <h2 style="font-family: 'Fraunces', serif; margin: 0; font-size: 24px;">Nellus Coworking</h2>
    <p style="font-size: 14px; color: #9FC2B2; margin-top: 8px;">Carregando sistema...</p>
  </div>
</div>

<script type="text/babel">
  const { useState, useEffect, useMemo, useRef } = React;

  // --- CONFIGURAÇÕES DE SEGURANÇA E BANCO DE DADOS ---
  const DB_BASE_URL = "https://nellus-gestao-default-rtdb.firebaseio.com/nellus";
  const FIREBASE_API_KEY = "AIzaSyCNv8l0xRgtoQX7q_UZQYspHASugTpr3BE";

  function uid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function Modal({ title, onClose, children }) {
    return (
      <div className="modal-veil" onClick={(e) => e.target === e.currentTarget && onClose()}>
        <div className="modal">
          <div className="modal-head">
            <h3>{title}</h3>
            <button className="icon-btn" onClick={onClose}>✕</button>
          </div>
          {children}
        </div>
      </div>
    );
  }

  // --- Funções de Fórmulas Automáticas e Formatação ---
  const parseExcelDate = (excelValue) => {
    if (!excelValue) return "";
    if (typeof excelValue === 'number') {
      const date = new Date((excelValue - 25569) * 86400 * 1000);
      return date.toISOString().slice(0, 10);
    }
    if (typeof excelValue === 'string') {
        const parts = excelValue.split(" ");
        if (parts[0].includes("-")) return parts[0];
        if (parts[0].includes("/")) {
            const d = parts[0].split("/");
            if (d.length === 3) return `${d[2]}-${d[1]}-${d[0]}`;
        }
    }
    return String(excelValue);
  };

  const decimalToTime = (decimal) => {
    if (decimal == null || decimal === "") return "";
    if (typeof decimal === 'number') {
      const totalSeconds = Math.round(decimal * 86400);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
    }
    return String(decimal);
  };

  const parseCurrencyToFloat = (val) => {
    if (!val) return 0;
    if (typeof val === 'number') return val;
    let str = String(val).replace('R$', '').trim();
    if (str.includes('.') && str.includes(',')) { str = str.replace(/\./g, ''); } 
    str = str.replace(',', '.'); 
    return parseFloat(str) || 0;
  };

  const formatFloatToCurrency = (val) => {
    return Number(val || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  };

  const calculateTimeDiff = (start, end) => {
    if (!start || !end) return { hoursStr: "", decimalHours: 0 };
    const [sH, sM] = start.split(':').map(Number);
    const [eH, eM] = end.split(':').map(Number);
    let diffMins = (eH * 60 + eM) - (sH * 60 + sM);
    if (diffMins < 0) diffMins += 24 * 60; // Passou da meia noite
    const h = Math.floor(diffMins / 60);
    const m = diffMins % 60;
    return {
        hoursStr: `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`,
        decimalHours: diffMins / 60
    };
  };

  function extractDataFromSheet(ws, identifierKeywords) {
    const rows = window.XLSX.utils.sheet_to_json(ws, { header: 1 });
    let headerIndex = -1;
    let headers = [];
    for (let i = 0; i < Math.min(30, rows.length); i++) {
      const rowArray = rows[i] || [];
      const rowStr = rowArray.join(" ").toUpperCase();
      if (identifierKeywords.some(kw => rowStr.includes(kw.toUpperCase()))) {
        headerIndex = i;
        headers = rowArray.map(h => String(h || "").trim().toUpperCase());
        break;
      }
    }
    if (headerIndex === -1) return [];

    const data = [];
    for (let i = headerIndex + 1; i < rows.length; i++) {
      const rowArray = rows[i] || [];
      if (rowArray.length === 0 || rowArray.every(cell => cell == null || String(cell).trim() === "")) continue;
      const obj = {};
      headers.forEach((h, colIdx) => {
        if (h) obj[h] = rowArray[colIdx] !== undefined ? rowArray[colIdx] : "";
      });
      data.push(obj);
    }
    return data;
  }

  function CellInput({ value, type, list, onSave }) {
      const [val, setVal] = useState(value || "");
      useEffect(() => { setVal(value || ""); }, [value]);
      return (
         <input className="cell-input" type={type === 'date' ? 'date' : type === 'time' ? 'time' : 'text'} list={list} value={val} onChange={e => setVal(e.target.value)} onBlur={() => { if (val !== (value || "")) onSave(val); }} placeholder="..." />
      );
  }

  function SpreadsheetView({ title, description, data, fields, onAdd, onUpdate, onRemoveBatch, onImport, sortBy }) {
     const fileInputRef = useRef(null);
     const [selectedRows, setSelectedRows] = useState(new Set());

     const sortedData = useMemo(() => {
         if (!sortBy) return data;
         return [...data].sort((a, b) => {
             const valA = a[sortBy] || "";
             const valB = b[sortBy] || "";
             if (!valA && !valB) return a.id.localeCompare(b.id);
             if (!valA) return 1; 
             if (!valB) return -1; 
             return valA.localeCompare(valB) || a.id.localeCompare(b.id);
         });
     }, [data, sortBy]);

     const exportXLS = () => {
        if (!window.XLSX) return alert("Ferramenta de exportação carregando, tente novamente em 2 segundos.");
        const exportData = sortedData.map(item => {
           let row = {};
           fields.forEach(f => { row[f.label] = item[f.name] || ""; });
           return row;
        });
        const ws = window.XLSX.utils.json_to_sheet(exportData);
        const wb = window.XLSX.utils.book_new();
        window.XLSX.utils.book_append_sheet(wb, ws, title.substring(0, 30));
        window.XLSX.writeFile(wb, `${title}_Nellus.xlsx`);
     };

     const addNewRow = () => { onAdd({ id: uid("r_") }); };

     const handleCellSave = (item, fieldName, newValue) => {
        let updated = { ...item, [fieldName]: newValue };
        if (title === "Vendas") {
           if (updated.inicio && updated.termino) {
               const diff = calculateTimeDiff(updated.inicio, updated.termino);
               updated.totalHoras = diff.hoursStr;
               if (updated.preco) {
                   const precoFloat = parseCurrencyToFloat(updated.preco);
                   updated.valorPagar = formatFloatToCurrency(diff.decimalHours * precoFloat);
               }
           }
        }
        onUpdate(updated);
     };

     const toggleAll = (e) => {
         if (e.target.checked) setSelectedRows(new Set(sortedData.map(d => d.id)));
         else setSelectedRows(new Set());
     };

     const toggleRow = (id) => {
         const next = new Set(selectedRows);
         if (next.has(id)) next.delete(id);
         else next.add(id);
         setSelectedRows(next);
     };

     const deleteSelected = () => {
         if(window.confirm(`Tem certeza que deseja apagar ${selectedRows.size} linha(s)?`)) {
             onRemoveBatch(Array.from(selectedRows), data);
             setSelectedRows(new Set());
         }
     };

     return (
        <div className="view">
          <div className="view-head">
            <div>
              <h2>{title} ({data.length})</h2>
              <p>{description}</p>
            </div>
            <div className="btn-group">
              {selectedRows.size > 0 && (
                 <button className="btn-primary danger" onClick={deleteSelected}>🗑 Excluir Selecionados</button>
              )}
              <input type="file" accept=".xlsx, .xls" style={{display: "none"}} ref={fileInputRef} onChange={onImport} />
              <button className="btn-primary outline" onClick={() => fileInputRef.current.click()}>📤 Importar Planilha</button>
              <button className="btn-primary outline" onClick={exportXLS}>📥 Exportar Planilha</button>
            </div>
          </div>
          <div className="table-wrapper">
             <table className="spreadsheet-table">
                <thead>
                   <tr>
                      <th className="actions" style={{paddingLeft: '14px'}}>
                         <input type="checkbox" className="checkbox-cell" checked={selectedRows.size > 0 && selectedRows.size === sortedData.length} onChange={toggleAll} />
                      </th>
                      {fields.map(f => <th key={f.name}>{f.label}</th>)}
                   </tr>
                </thead>
                <tbody>
                   {sortedData.map(item => (
                      <tr key={item.id}>
                         <td className="actions" style={{paddingLeft: '14px'}}>
                            <input type="checkbox" className="checkbox-cell" checked={selectedRows.has(item.id)} onChange={() => toggleRow(item.id)} />
                         </td>
                         {fields.map(f => (
                            <td key={f.name} style={(f.name === 'totalHoras' || f.name === 'valorPagar') ? {background: '#F9F9F9', fontWeight: 'bold'} : {}}>
                               <CellInput value={item[f.name]} type={f.type} list={f.suggest ? "client-list" : undefined} onSave={(newValue) => handleCellSave(item, f.name, newValue)} />
                            </td>
                         ))}
                      </tr>
                   ))}
                </tbody>
             </table>
             <button className="add-row-btn" onClick={addNewRow}>+ Preencher nova linha abaixo</button>
          </div>
        </div>
     );
  }

  const virtualFields = [
    { name: 'cliente', label: 'CLIENTE' }, { name: 'cpf', label: 'CPF' }, { name: 'email', label: 'EMAIL' },
    { name: 'contato', label: 'CONTATO' }, { name: 'razaoSocial', label: 'RAZÃO SOCIAL' }, { name: 'cnpj', label: 'CNPJ' },
    { name: 'dataEntrada', label: 'DATA DE ENTRADA', type: 'date' }, { name: 'formaPagamento', label: 'FORMA DE PAGAMENTO' },
  ];

  const presencialFields = [
    { name: 'cnpj', label: 'CNPJ' }, { name: 'razaoSocial', label: 'RAZÃO SOCIAL' }, { name: 'porte', label: 'PORTE EMPRESARIAL' },
    { name: 'cpf', label: 'CPF' }, { name: 'rg', label: 'RG' }, { name: 'dataNascimento', label: 'DATA NASCIMENTO', type: 'date' },
    { name: 'responsavel', label: 'CLIENTE/RESP. LEGAL' }, { name: 'atividade', label: 'ATIVIDADE' }, { name: 'servicoEmpresa', label: 'A SERVIÇO DA EMPRESA' },
    { name: 'telefone', label: 'TELEFONE' }, { name: 'email', label: 'E-MAIL' }, { name: 'logradouro', label: 'LOGRADOURO' },
    { name: 'cep', label: 'CEP' }, { name: 'bairro', label: 'BAIRRO' }, { name: 'cidade', label: 'CIDADE' }, { name: 'uf', label: 'UF' },
    { name: 'servico', label: 'SERVIÇO' }, { name: 'inicio', label: 'INÍCIO', type: 'date' }, { name: 'termino', label: 'TÉRMINO', type: 'date' },
    { name: 'contrato', label: 'Nº CONTRATO' },
  ];

  const vendasFields = [
    { name: 'data', label: 'DATA', type: 'date' }, { name: 'diaSemana', label: 'DIA SEMANA' }, { name: 'novoCliente', label: 'NOVO CLIENTE' },
    { name: 'propaganda', label: 'PROPAGANDA' }, { name: 'clienteCnpj', label: 'CLIENTE - CNPJ', suggest: true }, 
    { name: 'clienteCpf', label: 'CLIENTE - CPF (Nome)', suggest: true }, { name: 'contratacao', label: 'CONTRATAÇÃO' },
    { name: 'tipoServico', label: 'TIPO DE SERVIÇO' }, { name: 'preco', label: 'PREÇO' }, { name: 'inicio', label: 'INICIO', type: 'time' },
    { name: 'termino', label: 'TÉRMINO', type: 'time' }, { name: 'totalHoras', label: 'TOTAL HORAS (Auto)' }, { name: 'valorPagar', label: 'VALOR A PAGAR (Auto)' },
    { name: 'nf', label: 'N° NF' }, { name: 'pagamento', label: 'PAGAMENTO' }, { name: 'banco', label: 'BANCO' },
  ];

  function Agenda({ bookings, onAdd, onUpdate, onRemoveBatch }) {
    const todayStr = new Date().toISOString().slice(0, 10);
    const [currentMonth, setCurrentMonth] = useState(todayStr.slice(0, 7));
    const [activeDate, setActiveDate] = useState(todayStr);
    const [showForm, setShowForm] = useState(false);
    const [draft, setDraft] = useState({ clientName: "", date: todayStr, start: "09:00", end: "10:00", room: "", price: "", total: "", notes: "" });

    const daysInMonth = useMemo(() => {
      const [year, month] = currentMonth.split("-").map(Number);
      const lastDay = new Date(year, month, 0).getDate();
      const list = [];
      for (let d = 1; d <= lastDay; d++) {
        const dd = String(d).padStart(2, "0");
        list.push({ date: `${year}-${String(month).padStart(2, "0")}-${dd}`, day: dd, weekDay: new Date(year, month - 1, d).toLocaleDateString("pt-BR", { weekday: "short" }).replace(".", "") });
      }
      return list;
    }, [currentMonth]);

    const dayBookings = bookings.filter((b) => b.date === activeDate).sort((a, b) => (a.start || "").localeCompare(b.start || ""));

    const handleAgendaUpdate = (b, field, val) => {
        let updated = { ...b, [field]: val };
        if (field === 'start' || field === 'end' || field === 'price') {
            if (updated.start && updated.end && updated.price) {
                const diff = calculateTimeDiff(updated.start, updated.end);
                const priceFloat = parseCurrencyToFloat(updated.price);
                updated.total = formatFloatToCurrency(diff.decimalHours * priceFloat);
            } else {
                updated.total = "";
            }
        }
        onUpdate(updated);
    };

    const updateDraft = (field, val) => {
         let nextDraft = { ...draft, [field]: val };
         if (field === 'start' || field === 'end' || field === 'price') {
             if (nextDraft.start && nextDraft.end && nextDraft.price) {
                 const diff = calculateTimeDiff(nextDraft.start, nextDraft.end);
                 const priceFloat = parseCurrencyToFloat(nextDraft.price);
                 nextDraft.total = formatFloatToCurrency(diff.decimalHours * priceFloat);
             } else {
                 nextDraft.total = "";
             }
         }
         setDraft(nextDraft);
    };

    const submit = (e) => { 
        e.preventDefault(); 
        if (!draft.clientName || !draft.room) return; 
        onAdd({ ...draft, id: uid("b_") }); 
        setShowForm(false); 
    };

    const exportAgendaXLS = () => {
      if (!window.XLSX) return alert("Ferramenta de exportação carregando, aguarde um segundo.");
      const data = bookings.map((b) => ({ "Data": b.date.split("-").reverse().join("/"), "Início": b.start || "", "Fim": b.end || "", "Cliente": b.clientName || "", "Espaço / Sala": b.room || "", "Valor/h": b.price || "", "Total": b.total || "", "Observações": b.notes || "" }));
      const ws = window.XLSX.utils.json_to_sheet(data); const wb = window.XLSX.utils.book_new(); window.XLSX.utils.book_append_sheet(wb, ws, "Agenda"); window.XLSX.writeFile(wb, `Agenda_Nellus_${currentMonth}.xlsx`);
    };

    const exportAgendaPDF = () => {
      if (!window.jspdf) return alert("Ferramenta de PDF carregando, aguarde um segundo.");
      const { jsPDF } = window.jspdf; const doc = new jsPDF();
      doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.text("Nellus Coworking - Relatório da Agenda", 14, 18);
      doc.setFontSize(10); doc.setFont("helvetica", "normal"); doc.text(`Mês: ${currentMonth} | Emitido em: ${new Date().toLocaleDateString("pt-BR")}`, 14, 25);
      const tableData = bookings.sort((a, b) => a.date.localeCompare(b.date) || a.start.localeCompare(b.start)).map((b) => [ b.date.split("-").reverse().join("/"), `${b.start || ""} - ${b.end || ""}`, b.clientName || "", b.room || "", b.price || "", b.total || "", b.notes || "" ]);
      doc.autoTable({ head: [["Data", "Horário", "Cliente", "Espaço / Estação", "Valor/h", "Total", "Observações"]], body: tableData, startY: 30, theme: 'striped', headStyles: { fillColor: [14, 110, 86] }, styles: { fontSize: 9, font: 'helvetica' } });
      doc.save(`Agenda_Nellus_${currentMonth}.pdf`);
    };

    return (
      <div className="view">
        <div className="view-head">
          <div><h2>Agenda ({bookings.length})</h2><p>Reservas centralizadas com visualização do mês inteiro.</p></div>
          <div className="btn-group">
            <button className="btn-primary outline" onClick={exportAgendaXLS}>📥 XLS</button>
            <button className="btn-primary outline" onClick={exportAgendaPDF}>📄 PDF</button>
            <button className="btn-primary" onClick={() => { setDraft({ clientName: "", date: activeDate, start: "09:00", end: "10:00", room: "", price: "", total: "", notes: "" }); setShowForm(true); }}>+ Novo agendamento rápido</button>
          </div>
        </div>

        <div className="agenda-month-picker">
          <label>Selecione o Mês:</label>
          <input type="month" value={currentMonth} onChange={(e) => { setCurrentMonth(e.target.value); setActiveDate(`${e.target.value}-01`); }} />
        </div>

        <div className="date-rail-wrapper">
          <div className="date-rail">
            {daysInMonth.map((d) => {
              const hasBooking = bookings.some((b) => b.date === d.date);
              return (
                <button key={d.date} className={`date-chip ${d.date === activeDate ? "active" : ""} ${hasBooking ? "has-booking" : ""}`} onClick={() => setActiveDate(d.date)}>
                  <span className="day-week">{d.weekDay}</span><strong>{d.day}</strong>
                </button>
              );
            })}
          </div>
        </div>

        <div className="agenda-list">
          <div style={{ fontSize: "14px", fontWeight: "600", color: "var(--teal-deep)", marginBottom: "4px" }}>Agendamentos para {activeDate.split("-").reverse().join("/")}:</div>
          {dayBookings.length === 0 && <div className="empty-state">Nenhum agendamento para este dia.</div>}
          {dayBookings.map((b) => (
            <div className="agenda-row" key={b.id}>
              <div className="agenda-time">
                <span>⏱</span>
                <input type="time" className="inline-input" style={{width:'auto', fontWeight: '800', color: 'var(--ink)'}} value={b.start || ""} onChange={(e) => handleAgendaUpdate(b, 'start', e.target.value)} />
                <span>–</span>
                <input type="time" className="inline-input" style={{width:'auto', fontWeight: '800', color: 'var(--ink)'}} value={b.end || ""} onChange={(e) => handleAgendaUpdate(b, 'end', e.target.value)} />
              </div>
              <div className="agenda-main">
                <input className="inline-input" style={{ fontWeight: "bold", fontSize: "14px" }} list="client-list" placeholder="Nome do Cliente..." value={b.clientName || ""} onChange={(e) => handleAgendaUpdate(b, 'clientName', e.target.value)} />
                <div style={{ display: "flex", gap: "8px" }}>
                  <select className="inline-select muted" style={{width: 'auto'}} value={b.room || ""} onChange={(e) => handleAgendaUpdate(b, 'room', e.target.value)}>
                    <option value="">Selecione o espaço...</option><option value="Sala privativa 01">Sala privativa 01</option><option value="Sala privativa 02">Sala privativa 02</option><option value="Estação de trabalho">Estação de trabalho</option><option value="Visita">Visita</option>
                  </select>
                  <select className="inline-select" style={{width: 'auto', fontWeight: 'bold', color: 'var(--ink)'}} value={b.price || ""} onChange={(e) => handleAgendaUpdate(b, 'price', e.target.value)}>
                    <option value="">Valor/h...</option>
                    <option value="R$ 10,00">R$ 10,00</option>
                    <option value="R$ 45,00">R$ 45,00</option>
                    <option value="R$ 49,90">R$ 49,90</option>
                    <option value="R$ 55,00">R$ 55,00</option>
                    <option value="R$ 59,90">R$ 59,90</option>
                    <option value="R$ 65,00">R$ 65,00</option>
                    <option value="R$ 69,90">R$ 69,90</option>
                    <option value="R$ 520,00">R$ 520,00</option>
                    <option value="R$ 1.248,00">R$ 1.248,00</option>
                  </select>
                  <input className="inline-input" style={{width: '95px', fontWeight: 'bold', backgroundColor: '#F9F9F9', color: 'var(--teal-deep)'}} placeholder="Total..." value={b.total || ""} readOnly title="Calculado automaticamente" />
                  <input className="inline-input muted" placeholder="Observações..." value={b.notes || ""} onChange={(e) => handleAgendaUpdate(b, 'notes', e.target.value)} />
                </div>
              </div>
              <button className="icon-btn ghost" onClick={() => onRemoveBatch([b.id], bookings)}>🗑</button>
            </div>
          ))}
        </div>

        {showForm && (
          <Modal title="Novo agendamento" onClose={() => setShowForm(false)}>
            <form onSubmit={submit}>
              <div className="field"><label>Cliente</label><input list="client-list" value={draft.clientName} onChange={(e) => updateDraft('clientName', e.target.value)} placeholder="Digite para buscar..." required autoFocus /></div>
              <div className="form-row">
                <div className="field"><label>Data</label><input type="date" value={draft.date} onChange={(e) => updateDraft('date', e.target.value)} /></div>
                <div className="field"><label>Início</label><input type="time" value={draft.start} onChange={(e) => updateDraft('start', e.target.value)} /></div>
                <div className="field"><label>Fim</label><input type="time" value={draft.end} onChange={(e) => updateDraft('end', e.target.value)} /></div>
              </div>
              <div className="form-row">
                <div className="field">
                  <label>Espaço / Sala</label>
                  <select value={draft.room} onChange={(e) => updateDraft('room', e.target.value)} required>
                    <option value="">Selecione...</option><option value="Sala privativa 01">Sala privativa 01</option><option value="Sala privativa 02">Sala privativa 02</option><option value="Estação de trabalho">Estação de trabalho</option><option value="Visita">Visita</option>
                  </select>
                </div>
                <div className="field">
                  <label>Valor / Hora</label>
                  <select style={{fontWeight: 'bold'}} value={draft.price} onChange={(e) => updateDraft('price', e.target.value)}>
                    <option value="">Sem valor</option>
                    <option value="R$ 10,00">R$ 10,00</option>
                    <option value="R$ 45,00">R$ 45,00</option>
                    <option value="R$ 49,90">R$ 49,90</option>
                    <option value="R$ 55,00">R$ 55,00</option>
                    <option value="R$ 59,90">R$ 59,90</option>
                    <option value="R$ 65,00">R$ 65,00</option>
                    <option value="R$ 69,90">R$ 69,90</option>
                    <option value="R$ 520,00">R$ 520,00</option>
                    <option value="R$ 1.248,00">R$ 1.248,00</option>
                  </select>
                </div>
                <div className="field">
                  <label>Total (Auto)</label>
                  <input value={draft.total || ""} placeholder="R$ 0,00" readOnly style={{backgroundColor: '#F9F9F9', fontWeight: 'bold'}} />
                </div>
              </div>
              <div className="field"><label>Observações</label><input value={draft.notes} onChange={(e) => updateDraft('notes', e.target.value)} /></div>
              <button className="btn-primary full" type="submit">Salvar Agendamento</button>
            </form>
          </Modal>
        )}
      </div>
    );
  }

  // --- TELA DE LOGIN ---
  function LoginScreen({ onLogin, loadingMsg }) {
    const [email, setEmail] = useState("");
    const [pwd, setPwd] = useState("");
    return (
      <div className="login-container">
        <form className="login-box" onSubmit={(e) => { e.preventDefault(); onLogin(email, pwd); }}>
          <h2 style={{ fontFamily: "'Fraunces', serif", textAlign: 'center', color: 'var(--teal-deep)', fontSize: '28px', marginBottom: '8px', marginTop: 0 }}>Nellus Coworking</h2>
          <p style={{ textAlign: 'center', color: 'var(--muted)', fontSize: '14px', marginBottom: '24px', marginTop: 0 }}>Área Restrita</p>
          <div className="field">
             <label>E-mail de Acesso</label>
             <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="seu@email.com" required />
          </div>
          <div className="field" style={{marginTop: '16px'}}>
             <label>Senha</label>
             <input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} placeholder="••••••••" required />
          </div>
          <button className="btn-primary full" type="submit" style={{marginTop: '28px', padding: '14px', fontSize: '15px'}} disabled={loadingMsg !== ""}>
            {loadingMsg || "Entrar no Sistema"}
          </button>

      </div>
    );
  }

  // --- COMPONENTE PRINCIPAL ---
  function NellusApp() {
    const [authToken, setAuthToken] = useState(localStorage.getItem("nellus_token") || null);
    const [loginLoading, setLoginLoading] = useState("");

    const [tab, setTab] = useState("agenda");
    const [statusMsg, setStatusMsg] = useState("Conectando...");
    
    // Estado de Lixeira para Desfazer Exclusão
    const [undoState, setUndoState] = useState(null); 
    
    const [bookings, setBookings] = useState(() => { try { return JSON.parse(localStorage.getItem("nellus_bookings") || "[]"); } catch(e) { return []; } });
    const [clientesVirtual, setClientesVirtual] = useState([]);
    const [clientesPresencial, setClientesPresencial] = useState([]);
    const [vendas, setVendas] = useState([]);

    const handleLogin = async (email, password) => {
        setLoginLoading("Verificando...");
        try {
            const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FIREBASE_API_KEY}`, {
                method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email, password, returnSecureToken: true })
            });
            const data = await res.json();
            if (data.idToken) { setAuthToken(data.idToken); localStorage.setItem("nellus_token", data.idToken); } 
            else { alert("E-mail ou senha incorretos."); }
        } catch (err) { alert("Erro ao conectar com os servidores de autenticação."); }
        setLoginLoading("");
    };

    const handleLogout = () => { setAuthToken(null); localStorage.removeItem("nellus_token"); };

    const buscarDadosDaNuvem = async () => {
      if (!authToken) return;
      try {
        const res = await fetch(`${DB_BASE_URL}.json?auth=${authToken}`);
        if (res.status === 401) { handleLogout(); return; } // Token expirado
        if (!res.ok) { setStatusMsg("⚠️ Erro de Permissão"); return; }
        
        const data = await res.json();
        if (data) {
          if (data.bookings) {
            const list = Object.values(data.bookings);
            setBookings(list); localStorage.setItem("nellus_bookings", JSON.stringify(list));
          }
          if (data.clientesVirtual) setClientesVirtual(Object.values(data.clientesVirtual));
          if (data.clientesPresencial) setClientesPresencial(Object.values(data.clientesPresencial));
          if (data.vendas) setVendas(Object.values(data.vendas));
        }
        setStatusMsg("🟢 Nuvem Conectada");
      } catch (err) { setStatusMsg("⚠️ Verifique a conexão"); }
    };

    const enviarParaNuvem = async (caminho, id, dados) => {
      if (!authToken) return;
      setStatusMsg("⏳ Salvando...");
      try {
        const url = `${DB_BASE_URL}/${caminho}/${id}.json?auth=${authToken}`;
        if (dados === null) await fetch(url, { method: "DELETE" });
        else await fetch(url, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(dados) });
        setStatusMsg("🟢 Salvo na Nuvem");
      } catch (err) { setStatusMsg("⚠️ Erro ao salvar"); }
    };

    useEffect(() => {
      if (authToken) {
          buscarDadosDaNuvem();
          const interval = setInterval(buscarDadosDaNuvem, 5000);
          return () => clearInterval(interval);
      }
    }, [authToken]);

    if (!authToken) {
        return <LoginScreen onLogin={handleLogin} loadingMsg={loginLoading} />;
    }

    const crudHandler = (stateSetter, collectionName) => ({
      add: (novo) => { stateSetter(prev => [...prev, novo]); enviarParaNuvem(collectionName, novo.id, novo); },
      update: (item) => { stateSetter(prev => prev.map(i => i.id === item.id ? item : i)); enviarParaNuvem(collectionName, item.id, item); },
      removeBatch: (idsArray, currentData) => { 
          const itemsToDelete = currentData.filter(i => idsArray.includes(i.id));
          setUndoState({ collection: collectionName, items: itemsToDelete, setter: stateSetter });
          stateSetter(prev => prev.filter(i => !idsArray.includes(i.id))); 
          idsArray.forEach(id => enviarParaNuvem(collectionName, id, null));
          if(window.undoTimeout) clearTimeout(window.undoTimeout);
          window.undoTimeout = setTimeout(() => setUndoState(null), 10000);
      }
    });

    const handleUndo = () => {
        if (!undoState) return;
        undoState.setter(prev => [...prev, ...undoState.items]);
        undoState.items.forEach(item => enviarParaNuvem(undoState.collection, item.id, item));
        setUndoState(null);
        clearTimeout(window.undoTimeout);
    };

    const hBookings = crudHandler(setBookings, "bookings");
    const hVirtual = crudHandler(setClientesVirtual, "clientesVirtual");
    const hPresencial = crudHandler(setClientesPresencial, "clientesPresencial");
    const hVendas = crudHandler(setVendas, "vendas");

    const allClientNames = useMemo(() => {
      const names = new Set();
      clientesVirtual.forEach(c => { if (c.cliente) names.add(c.cliente); if (c.razaoSocial) names.add(c.razaoSocial); });
      clientesPresencial.forEach(c => { if (c.responsavel) names.add(c.responsavel); if (c.razaoSocial) names.add(c.razaoSocial); });
      return Array.from(names).filter(Boolean).sort();
    }, [clientesVirtual, clientesPresencial]);

    const handleImportVirtual = (e) => {
      const file = e.target.files[0]; if (!file) return;
      if (!window.XLSX) return alert("A ferramenta de importação ainda está carregando. Aguarde 2 segundos e tente novamente.");
      const reader = new FileReader();
      reader.onload = (evt) => {
        const workbook = window.XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
        const ws = workbook.Sheets[workbook.SheetNames.includes("CLIENTES - Escritório Virtual") ? "CLIENTES - Escritório Virtual" : workbook.SheetNames[0]];
        let count = 0;
        extractDataFromSheet(ws, ["FORMA DE PAGAMENTO", "CLIENTE", "CPF"]).forEach(row => {
           const id = uid("cv_");
           const item = { id, cliente: row["CLIENTE"] || "", cpf: row["CPF"] || "", email: row["EMAIL"] || row["E-MAIL"] || "", contato: row["CONTATO"] || "", razaoSocial: row["RAZÃO SOCIAL"] || "", cnpj: row["CNPJ"] || "", dataEntrada: parseExcelDate(row["DATA DE ENTRADA"]), formaPagamento: row["FORMA DE PAGAMENTO"] || "" };
           if (item.cliente || item.razaoSocial || item.cpf) { hVirtual.add(item); count++; }
        });
        alert(`Foram importados ${count} clientes com sucesso!`); e.target.value = null;
      }; reader.readAsArrayBuffer(file);
    };

    const handleImportPresencial = (e) => {
      const file = e.target.files[0]; if (!file) return;
      if (!window.XLSX) return alert("A ferramenta de importação ainda está carregando. Aguarde 2 segundos e tente novamente.");
      const reader = new FileReader();
      reader.onload = (evt) => {
        const workbook = window.XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
        const ws = workbook.Sheets[workbook.SheetNames.includes("CLIENTES - Presencial") ? "CLIENTES - Presencial" : workbook.SheetNames[0]];
        let count = 0;
        extractDataFromSheet(ws, ["PORTE EMPRESARIAL", "CLIENTE/RESP. LEGAL", "CNPJ"]).forEach(row => {
           const id = uid("cp_");
           const item = { id, cnpj: row["CNPJ"] || "", razaoSocial: row["RAZÃO SOCIAL"] || "", porte: row["PORTE EMPRESARIAL"] || "", cpf: row["CPF"] || "", rg: row["RG"] || "", dataNascimento: parseExcelDate(row["DATA NASCIMENTO"]), responsavel: row["CLIENTE/RESP. LEGAL"] || row["CLIENTE"] || "", atividade: row["ATIVIDADE"] || "", servicoEmpresa: row["A SERVIÇO DA EMPRESA"] || "", telefone: row["TELEFONE"] || "", email: row["E-MAIL"] || row["EMAIL"] || "", logradouro: row["LOGRADOURO"] || "", cep: row["CEP"] || "", bairro: row["BAIRRO"] || "", cidade: row["CIDADE"] || "", uf: row["UF"] || "", servico: row["SERVIÇO"] || "", inicio: parseExcelDate(row["INÍCIO"]) || parseExcelDate(row["INICIO"]), termino: parseExcelDate(row["TÉRMINO"]) || parseExcelDate(row["TERMINO"]), contrato: row["Nº CONTRATO"] || row["N° CONTRATO"] || "" };
           if (item.responsavel || item.razaoSocial || item.cnpj) { hPresencial.add(item); count++; }
        });
        alert(`Foram importados ${count} clientes com sucesso!`); e.target.value = null;
      }; reader.readAsArrayBuffer(file);
    };

    const handleImportVendas = (e) => {
      const file = e.target.files[0]; if (!file) return;
      if (!window.XLSX) return alert("A ferramenta de importação ainda está carregando. Aguarde 2 segundos e tente novamente.");
      const reader = new FileReader();
      reader.onload = (evt) => {
        const workbook = window.XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
        const ws = workbook.Sheets[workbook.SheetNames.includes("VENDAS") ? "VENDAS" : workbook.SheetNames[0]];
        let count = 0;
        extractDataFromSheet(ws, ["CLIENTE - CPF", "TIPO DE SERVIÇO", "CONTRATAÇÃO"]).forEach(row => {
           const id = uid("v_");
           const item = { id, data: parseExcelDate(row["DATA"]), diaSemana: row["DIA SEMANA"] || "", novoCliente: row["NOVO CLIENTE"] || "", propaganda: row["PROPAGANDA"] || "", clienteCnpj: row["CLIENTE - CNPJ"] || "", clienteCpf: row["CLIENTE - CPF"] || "", contratacao: row["CONTRATAÇÃO"] || "", tipoServico: row["TIPO DE SERVIÇO"] || "", preco: row["PREÇO"] || row["PRECO"] || row["PREÇO "] || "", inicio: decimalToTime(row["INICIO"]) || decimalToTime(row["INÍCIO"]) || "", termino: decimalToTime(row["TÉRMINO"]) || decimalToTime(row["TERMINO"]) || "", totalHoras: row["TOTAL HORAS"] || "", valorPagar: row["VALOR A PAGAR"] || "", nf: row["N° NF"] || row["Nº NF"] || "", pagamento: row["PAGAMENTO"] || "", banco: row["BANCO"] || "" };
           if (item.data || item.clienteCpf || item.tipoServico || item.preco) { hVendas.add(item); count++; }
        });
        alert(`Foram importadas ${count} vendas com sucesso!`); e.target.value = null;
      }; reader.readAsArrayBuffer(file);
    };

    return (
      <div className="nellus-app">
        <datalist id="client-list">
          {allClientNames.map(name => <option key={name} value={name} />)}
        </datalist>

        {undoState && (
           <div className="toast-undo">
              <span>{undoState.items.length} item(s) excluído(s).</span>
              <button onClick={handleUndo}>↩ Desfazer</button>
           </div>
        )}

        <aside className="sidebar">
          <div className="brand">
            <div className="brand-text">
              <b>Nellus Coworking</b>
              <span>Gestão Centralizada</span>
              <span className="sync-status">{statusMsg}</span>
            </div>
          </div>
          <nav className="nav">
            <button className={"nav-item" + (tab === "agenda" ? " active" : "")} onClick={() => setTab("agenda")}>📅 Agenda</button>
            <button className={"nav-item" + (tab === "virtual" ? " active" : "")} onClick={() => setTab("virtual")}>💻 Escritório Virtual</button>
            <button className={"nav-item" + (tab === "presencial" ? " active" : "")} onClick={() => setTab("presencial")}>🏢 Cliente Presencial</button>
            <button className={"nav-item" + (tab === "vendas" ? " active" : "")} onClick={() => setTab("vendas")}>💰 Vendas</button>
          </nav>
          <div className="sidebar-foot" style={{display: 'flex', flexDirection: 'column', gap: '12px'}}>
            <div><b>Vercel + Firebase</b><br />Protegido por Autenticação.</div>
            <button className="btn-primary secondary outline" onClick={handleLogout} style={{justifyContent: 'center', width: 'fit-content'}}>Sair (Logout)</button>
          </div>
        </aside>

        <main className="main">
          {tab === "agenda" && <Agenda bookings={bookings} onAdd={hBookings.add} onUpdate={hBookings.update} onRemoveBatch={hBookings.removeBatch} />}
          {tab === "virtual" && <SpreadsheetView title="Escritório Virtual" sortBy="dataEntrada" description="Planilha editável: preencha e o app salva automaticamente." data={clientesVirtual} fields={virtualFields} onAdd={hVirtual.add} onUpdate={hVirtual.update} onRemoveBatch={hVirtual.removeBatch} onImport={handleImportVirtual} />}
          {tab === "presencial" && <SpreadsheetView title="Clientes Presenciais" sortBy="inicio" description="Planilha editável: preencha e o app salva automaticamente." data={clientesPresencial} fields={presencialFields} onAdd={hPresencial.add} onUpdate={hPresencial.update} onRemoveBatch={hPresencial.removeBatch} onImport={handleImportPresencial} />}
          {tab === "vendas" && <SpreadsheetView title="Vendas" sortBy="data" description="Planilha inteligente: Fórmulas de Horas e Valores calculam sozinhas!" data={vendas} fields={vendasFields} onAdd={hVendas.add} onUpdate={hVendas.update} onRemoveBatch={hVendas.removeBatch} onImport={handleImportVendas} />}
        </main>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<NellusApp />);
</script>

</body>
</html>
