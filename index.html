<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Nellus Coworking - Gestão</title>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase SDK (Compat v9) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap');

    body {
      margin: 0;
      padding: 20px;
      background-color: #EFEAE0;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .nellus-app {
      --ink: #1B2420;
      --muted: #8A8578;
      --paper: #F7F5F0;
      --surface: #FFFFFF;
      --border: #E4DFD3;
      --teal: #0E6E56;
      --teal-deep: #0A4F3E;
      --orange: #E08A52;
      --orange-deep: #C96B34;
      --up: #1F9D6C;
      --down: #C1483B;
      font-family: 'Manrope', system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
      display: grid;
      grid-template-columns: 236px 1fr;
      min-height: 720px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    .nellus-app * { box-sizing: border-box; }

    .sidebar {
      background: linear-gradient(180deg, var(--teal-deep), #08392C 85%);
      color: #EFEAE0;
      padding: 26px 18px;
      display: flex;
      flex-direction: column;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 28px; }
    .brand-text { display: flex; flex-direction: column; line-height: 1.1; }
    .brand-text b { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; }
    .brand-text span { font-size: 11.5px; color: #B9CFC5; }

    .nav { display: flex; flex-direction: column; gap: 4px; }
    .nav-item {
      display: flex; align-items: center; gap: 11px;
      padding: 10px 12px; border-radius: 10px;
      background: transparent; border: none; cursor: pointer;
      color: #D8E6DE; font-family: inherit; font-size: 14.5px; font-weight: 500;
      text-align: left; transition: background 0.15s ease, color 0.15s ease;
    }
    .nav-item:hover { background: rgba(255,255,255,0.06); }
    .nav-item.active { background: var(--orange); color: #1B2420; font-weight: 600; }

    .sidebar-foot {
      margin-top: auto; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.12);
      font-size: 12px; color: #9FC2B2; line-height: 1.5;
    }
    .sidebar-foot b { color: #EFEAE0; font-size: 13px; }

    .main { padding: 28px 32px 32px; overflow-y: auto; }
    .view-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
    .view-head h2 { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600; margin: 0 0 4px; }
    .view-head p { margin: 0; color: var(--muted); font-size: 13.5px; }

    .btn-group { display: flex; gap: 8px; }

    .btn-primary {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--orange); color: #23140A; border: none;
      padding: 10px 16px; border-radius: 10px; font-family: inherit;
      font-size: 13.5px; font-weight: 700; cursor: pointer; white-space: nowrap;
      text-decoration: none;
    }
    .btn-primary:hover { background: var(--orange-deep); color: #fff; }
    .btn-primary.secondary { background: #E4DFD3; color: #1B2420; }
    .btn-primary.secondary:hover { background: #D0C9B8; }
    .btn-primary.full { width: 100%; justify-content: center; margin-top: 8px; }

    .icon-btn {
      border: none; background: var(--surface); border: 1px solid var(--border);
      width: 32px; height: 32px; border-radius: 8px; display: flex;
      align-items: center; justify-content: center; cursor: pointer; color: var(--ink);
    }
    .icon-btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
    .icon-btn.ghost:hover { background: #F1ECE1; color: var(--down); }

    .inline-input {
      border: 1px solid transparent; background: transparent;
      font-family: inherit; font-size: inherit; color: inherit;
      padding: 3px 6px; border-radius: 6px; width: 100%;
    }
    .inline-input:hover { border-color: var(--border); background: #FFFFFF; }
    .inline-input:focus { border-color: var(--teal); background: #FFFFFF; outline: none; }

    .inline-select {
      border: 1px solid transparent; background: transparent;
      font-family: inherit; font-size: inherit; color: inherit;
      padding: 3px 6px; border-radius: 6px; cursor: pointer;
    }
    .inline-select:hover, .inline-select:focus { border-color: var(--teal); background: #FFFFFF; outline: none; }

    .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; margin-bottom: 12px; }
    .field input, .field select {
      padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border);
      font-family: inherit; font-size: 13.5px; outline: none; background: #fff;
    }
    .field input:focus, .field select:focus { border-color: var(--teal); }

    .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }

    .radio-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .radio-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px;
      border-radius: 20px; border: 1px solid var(--border); font-size: 12.5px;
      cursor: pointer; background: #fff; font-weight: 500;
    }
    .radio-pill.active { background: var(--teal); color: #fff; border-color: var(--teal); }
    .radio-pill input { display: none; }

    .modal-veil {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .modal {
      background: var(--surface); border-radius: 14px; width: 100%; max-width: 480px;
      padding: 20px 24px; border: 1px solid var(--border); box-shadow: 0 12px 32px rgba(0,0,0,0.15);
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .modal-head h3 { font-family: 'Fraunces', serif; margin: 0; font-size: 20px; }

    .type-settings-bar {
      display: flex; gap: 12px; margin-bottom: 18px; padding: 12px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      align-items: center; flex-wrap: wrap;
    }
    .type-input-group { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
    .type-input-group input { padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border); font-size: 12px; }

    .client-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .client-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; display: flex; flex-direction: column; gap: 8px;
    }
    .client-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .client-line { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
    .client-card-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 11.5px; }

    .date-rail { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
    .date-chip {
      border: 1px solid var(--border); background: var(--surface); color: var(--ink);
      padding: 8px 14px; border-radius: 999px; font-size: 13px; cursor: pointer; font-weight: 500;
    }
    .date-chip.active { background: var(--teal); border-color: var(--teal); color: #fff; }

    .agenda-list { display: flex; flex-direction: column; gap: 10px; }
    .agenda-row {
      display: flex; align-items: center; gap: 12px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px;
    }
    .agenda-time { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); width: 180px; flex-shrink: 0; }
    .agenda-time input { padding: 2px 4px; font-size: 12.5px; }
    .agenda-main { display: flex; flex-direction: column; flex: 1; gap: 2px; }

    .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;
    }
    .stat-label { font-size: 12px; color: var(--muted); font-weight: 600; }
    .stat-value { font-size: 20px; font-weight: 700; }
    .stat-value.up { color: var(--up); }
    .stat-value.down { color: var(--down); }

    .tx-panel {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 18px; margin-bottom: 20px;
    }
    .chart-panel-head { margin-bottom: 14px; }
    .chart-panel-head h3 { margin: 0 0 2px; font-family: 'Fraunces', serif; font-size: 18px; }

    .tx-list { display: flex; flex-direction: column; gap: 8px; }
    .tx-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .tx-row:last-child { border-bottom: none; }
    .tx-main { display: flex; flex-direction: column; flex: 1; gap: 2px; }
    .tx-sub { display: flex; gap: 8px; align-items: center; }

    .muted { color: var(--muted); font-size: 12px; }
    .empty-state { padding: 30px; text-align: center; color: var(--muted); background: var(--surface); border-radius: 12px; border: 1px dashed var(--border); }
    .sync-status { font-size: 11px; padding: 3px 8px; border-radius: 12px; background: rgba(255,255,255,0.15); display: inline-block; margin-top: 5px; }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect, useMemo } = React;

  // -------------------------------------------------------------
  // CONFIGURAÇÃO DO FIREBASE (Substitua pelos dados do seu Console)
  // -------------------------------------------------------------
  const firebaseConfig = {
    apiKey: "SUA_API_KEY_AQUI",
    authDomain: "seu-projeto.firebaseapp.com",
    projectId: "seu-projeto",
    storageBucket: "seu-projeto.appspot.com",
    messagingSenderId: "1234567890",
    appId: "1:1234567890:web:abcdef123456"
  };

  // Inicializa o Firebase se tiver sido configurado
  const isFirebaseActive = firebaseConfig.apiKey !== "SUA_API_KEY_AQUI";
  let db = null;
  if (isFirebaseActive) {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }

  const money = (v) => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

  function Modal({ title, onClose, children }) {
    return (
      <div className="modal-veil" onClick={(e) => e.target === e.currentTarget && onClose()}>
        <div className="modal">
          <div className="modal-head">
            <h3>{title}</h3>
            <button className="icon-btn" onClick={onClose}>✕</button>
          </div>
          {children}
        </div>
      </div>
    );
  }

  // AGENDA COMPONENT
  function Agenda({ bookings, clients, onAdd, onUpdate, onRemove }) {
    const [activeDate, setActiveDate] = useState("2026-09-01");
    const [showForm, setShowForm] = useState(false);
    const [isCustom, setIsCustom] = useState(false);
    const [draft, setDraft] = useState({ clientName: "", date: "2026-09-01", start: "09:00", end: "10:00", room: "", notes: "" });

    const dayBookings = bookings.filter((b) => b.date === activeDate);

    const submit = (e) => {
      e.preventDefault();
      if (!draft.clientName || !draft.room) return;
      onAdd({ ...draft });
      setShowForm(false);
      setDraft({ clientName: "", date: draft.date, start: "09:00", end: "10:00", room: "", notes: "" });
    };

    return (
      <div className="view">
        <div className="view-head">
          <div>
            <h2>Agenda</h2>
            <p>Reservas de estações, salas e horários sincronizados em nuvem.</p>
          </div>
          <button className="btn-primary" onClick={() => setShowForm(true)}>+ Novo agendamento</button>
        </div>

        <div className="date-rail">
          {["2026-09-01", "2026-09-02", "2026-09-03"].map((d) => (
            <button key={d} className={"date-chip" + (d === activeDate ? " active" : "")} onClick={() => setActiveDate(d)}>
              {d.split('-').reverse().join('/')}
            </button>
          ))}
        </div>

        <div className="agenda-list">
          {dayBookings.length === 0 && <div className="empty-state">Nenhum agendamento para este dia.</div>}
          {dayBookings.map((b) => (
            <div className="agenda-row" key={b.id}>
              <div className="agenda-time">
                <span>⏱</span>
                <input type="time" className="inline-input" value={b.start || ""} onChange={(e) => onUpdate(b.id, { start: e.target.value })} />
                <span>–</span>
                <input type="time" className="inline-input" value={b.end || ""} onChange={(e) => onUpdate(b.id, { end: e.target.value })} />
              </div>
              <div className="agenda-main">
                <input 
                  className="inline-input" 
                  style={{ fontWeight: "bold" }} 
                  value={b.clientName || ""} 
                  onChange={(e) => onUpdate(b.id, { clientName: e.target.value })} 
                />
                <div style={{ display: "flex", gap: "8px" }}>
                  <input 
                    className="inline-input muted" 
                    placeholder="Espaço/Sala..."
                    value={b.room || ""} 
                    onChange={(e) => onUpdate(b.id, { room: e.target.value })} 
                  />
                  <input 
                    className="inline-input muted" 
                    placeholder="Observações..."
                    value={b.notes || ""} 
                    onChange={(e) => onUpdate(b.id, { notes: e.target.value })} 
                  />
                </div>
              </div>
              <button className="icon-btn ghost" onClick={() => onRemove(b.id)}>🗑</button>
            </div>
          ))}
        </div>

        {showForm && (
          <Modal title="Novo agendamento" onClose={() => setShowForm(false)}>
            <form onSubmit={submit}>
              <div className="field">
                <label>Cliente</label>
                {!isCustom ? (
                  <select value={draft.clientName} onChange={(e) => {
                    if (e.target.value === "NEW") { setIsCustom(true); setDraft({ ...draft, clientName: "" }); }
                    else setDraft({ ...draft, clientName: e.target.value });
                  }}>
                    <option value="">Selecione um cliente...</option>
                    {clients.map((c) => <option key={c.id} value={c.name}>{c.name}</option>)}
                    <option value="NEW">+ Inserir cliente avulso / não cadastrado</option>
                  </select>
                ) : (
                  <div style={{ display: "flex", gap: "6px" }}>
                    <input placeholder="Digite o nome do cliente avulso..." value={draft.clientName} onChange={(e) => setDraft({ ...draft, clientName: e.target.value })} style={{ flex: 1 }} />
                    <button type="button" className="btn-primary secondary" onClick={() => setIsCustom(false)}>Lista</button>
                  </div>
                )}
              </div>

              <div className="form-row">
                <div className="field"><label>Data</label><input type="date" value={draft.date} onChange={(e) => setDraft({ ...draft, date: e.target.value })} /></div>
                <div className="field"><label>Início</label><input type="time" value={draft.start} onChange={(e) => setDraft({ ...draft, start: e.target.value })} /></div>
                <div className="field"><label>Fim</label><input type="time" value={draft.end} onChange={(e) => setDraft({ ...draft, end: e.target.value })} /></div>
              </div>

              <div className="field"><label>Espaço / Estação</label><input placeholder="Ex.: Estação 4, Sala de Reunião" value={draft.room} onChange={(e) => setDraft({ ...draft, room: e.target.value })} /></div>
              <div className="field"><label>Observações</label><input value={draft.notes} onChange={(e) => setDraft({ ...draft, notes: e.target.value })} /></div>

              <button className="btn-primary full" type="submit">Salvar Agendamento</button>
            </form>
          </Modal>
        )}
      </div>
    );
  }

  // CLIENTES COMPONENT
  function Clientes({ clients, typeLabels, setTypeLabels, onAdd, onUpdate, onRemove }) {
    const [showForm, setShowForm] = useState(false);
    const [draft, setDraft] = useState({ name: "", document: "", address: "", type: "presencial", phone: "", email: "" });

    const submit = (e) => {
      e.preventDefault();
      onAdd({ ...draft, since: new Date().toISOString().slice(0, 10) });
      setShowForm(false);
      setDraft({ name: "", document: "", address: "", type: "presencial", phone: "", email: "" });
    };

    return (
      <div className="view">
        <div className="view-head">
          <div>
            <h2>Clientes</h2>
            <p>Gerenciamento de contratos e cadastros em tempo real.</p>
          </div>
          <button className="btn-primary" onClick={() => setShowForm(true)}>+ Novo cliente</button>
        </div>

        <div className="type-settings-bar">
          <span style={{ fontSize: "12px", color: "var(--muted)", fontWeight: "bold" }}>Nomes dos Planos:</span>
          <div className="type-input-group">
            <span style={{ color: "#E08A52" }}>●</span>
            <input value={typeLabels.presencial} onChange={(e) => setTypeLabels({ ...typeLabels, presencial: e.target.value })} />
          </div>
          <div className="type-input-group">
            <span style={{ color: "#0E6E56" }}>●</span>
            <input value={typeLabels.salaFixa} onChange={(e) => setTypeLabels({ ...typeLabels, salaFixa: e.target.value })} />
          </div>
          <div className="type-input-group">
            <span style={{ color: "#3E7CB1" }}>●</span>
            <input value={typeLabels.virtual} onChange={(e) => setTypeLabels({ ...typeLabels, virtual: e.target.value })} />
          </div>
        </div>

        <div className="client-grid">
          {clients.map((c) => (
            <div className="client-card" key={c.id}>
              <div className="client-card-top">
                <div style={{ flex: 1 }}>
                  <input 
                    className="inline-input" 
                    style={{ fontWeight: "bold", fontSize: "14px" }} 
                    value={c.name || ""} 
                    placeholder="Nome do cliente"
                    onChange={(e) => onUpdate(c.id, { name: e.target.value })} 
                  />
                  <input 
                    className="inline-input muted" 
                    value={c.document || ""} 
                    placeholder="CPF / CNPJ"
                    onChange={(e) => onUpdate(c.id, { document: e.target.value })} 
                  />
                </div>
                <select 
                  className="inline-select"
                  value={c.type || "presencial"}
                  onChange={(e) => onUpdate(c.id, { type: e.target.value })}
                >
                  <option value="presencial">{typeLabels.presencial}</option>
                  <option value="salaFixa">{typeLabels.salaFixa}</option>
                  <option value="virtual">{typeLabels.virtual}</option>
                </select>
              </div>

              <div className="client-line">
                <span>📍</span>
                <input 
                  className="inline-input" 
                  value={c.address || ""} 
                  placeholder="Endereço"
                  onChange={(e) => onUpdate(c.id, { address: e.target.value })} 
                />
              </div>

              <div className="client-line">
                <span>📞</span>
                <input 
                  className="inline-input" 
                  value={c.phone || ""} 
                  placeholder="Telefone"
                  onChange={(e) => onUpdate(c.id, { phone: e.target.value })} 
                />
              </div>

              <div className="client-line">
                <span>✉️</span>
                <input 
                  className="inline-input" 
                  value={c.email || ""} 
                  placeholder="E-mail"
                  onChange={(e) => onUpdate(c.id, { email: e.target.value })} 
                />
              </div>

              <div className="client-card-foot">
                <div style={{ display: "flex", alignItems: "center", gap: "4px" }}>
                  <span className="muted">Desde:</span>
                  <input 
                    type="date" 
                    className="inline-input muted" 
                    value={c.since || ""} 
                    onChange={(e) => onUpdate(c.id, { since: e.target.value })} 
                  />
                </div>
                <button className="icon-btn ghost" onClick={() => onRemove(c.id)}>🗑</button>
              </div>
            </div>
          ))}
        </div>

        {showForm && (
          <Modal title="Novo cliente" onClose={() => setShowForm(false)}>
            <form onSubmit={submit}>
              <div className="field"><label>Nome / Razão social</label><input value={draft.name} onChange={(e) => setDraft({ ...draft, name: e.target.value })} required /></div>
              <div className="field"><label>CPF / CNPJ</label><input value={draft.document} onChange={(e) => setDraft({ ...draft, document: e.target.value })} /></div>
              <div className="field"><label>Endereço</label><input value={draft.address} onChange={(e) => setDraft({ ...draft, address: e.target.value })} /></div>
              <div className="field">
                <label>Tipo de Contrato</label>
                <div className="radio-row">
                  {Object.keys(typeLabels).map((t) => (
                    <label key={t} className={"radio-pill" + (draft.type === t ? " active" : "")}>
                      <input type="radio" checked={draft.type === t} onChange={() => setDraft({ ...draft, type: t })} />
                      {typeLabels[t]}
                    </label>
                  ))}
                </div>
              </div>
              <div className="form-row">
                <div className="field"><label>Telefone</label><input value={draft.phone} onChange={(e) => setDraft({ ...draft, phone: e.target.value })} /></div>
                <div className="field"><label>E-mail</label><input value={draft.email} onChange={(e) => setDraft({ ...draft, email: e.target.value })} /></div>
              </div>

              <button className="btn-primary full" type="submit">Cadastrar Cliente</button>
            </form>
          </Modal>
        )}
      </div>
    );
  }

  // FINANCEIRO COMPONENT
  function Financeiro({ tx, onAdd, onUpdate, onRemove }) {
    const [showForm, setShowForm] = useState(false);
    const [draft, setDraft] = useState({ type: "entrada", desc: "", amount: "", date: "2026-09-01", category: "" });

    const totals = useMemo(() => {
      const entradas = tx.filter((t) => t.type === "entrada").reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);
      const saidas = tx.filter((t) => t.type === "saida").reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);
      return { entradas, saidas, saldo: entradas - saidas };
    }, [tx]);

    const submit = (e) => {
      e.preventDefault();
      const amount = parseFloat(draft.amount);
      if (!draft.desc || isNaN(amount)) return;
      onAdd({ ...draft, amount });
      setShowForm(false);
      setDraft({ type: "entrada", desc: "", amount: "", date: draft.date, category: "" });
    };

    return (
      <div className="view">
        <div className="view-head">
          <div>
            <h2>Financeiro</h2>
            <p>Controle unificado de entradas e saídas.</p>
          </div>
          <button className="btn-primary" onClick={() => setShowForm(true)}>+ Novo lançamento</button>
        </div>

        <div className="stat-row">
          <div className="stat-card">
            <span className="stat-label">Entradas</span>
            <strong className="stat-value up">{money(totals.entradas)}</strong>
          </div>
          <div className="stat-card">
            <span className="stat-label">Saídas</span>
            <strong className="stat-value down">{money(totals.saidas)}</strong>
          </div>
          <div className="stat-card">
            <span className="stat-label">Saldo Acumulado</span>
            <strong className={"stat-value " + (totals.saldo >= 0 ? "up" : "down")}>{money(totals.saldo)}</strong>
          </div>
        </div>

        <div className="tx-panel">
          <div className="chart-panel-head"><h3>Lançamentos</h3></div>
          <div className="tx-list">
            {tx.map((t) => (
              <div className="tx-row" key={t.id}>
                <div className="tx-main">
                  <input 
                    className="inline-input" 
                    style={{ fontWeight: "bold" }} 
                    value={t.desc || ""} 
                    onChange={(e) => onUpdate(t.id, { desc: e.target.value })} 
                  />
                  <div className="tx-sub">
                    <input 
                      className="inline-input muted" 
                      placeholder="Categoria"
                      value={t.category || ""} 
                      onChange={(e) => onUpdate(t.id, { category: e.target.value })} 
                    />
                    <span className="muted">•</span>
                    <input 
                      type="date"
                      className="inline-input muted" 
                      value={t.date || ""} 
                      onChange={(e) => onUpdate(t.id, { date: e.target.value })} 
                    />
                  </div>
                </div>

                <select 
                  className="inline-select"
                  value={t.type || "entrada"}
                  onChange={(e) => onUpdate(t.id, { type: e.target.value })}
                >
                  <option value="entrada">Entrada (+)</option>
                  <option value="saida">Saída (-)</option>
                </select>

                <div style={{ display: "flex", alignItems: "center", gap: "2px", width: "110px" }}>
                  <span className="muted">R$</span>
                  <input 
                    type="number"
                    step="0.01"
                    className={"inline-input " + (t.type === "entrada" ? "up" : "down")}
                    style={{ fontWeight: "bold", textAlign: "right" }}
                    value={t.amount || 0} 
                    onChange={(e) => onUpdate(t.id, { amount: parseFloat(e.target.value) || 0 })} 
                  />
                </div>

                <button className="icon-btn ghost" onClick={() => onRemove(t.id)}>🗑</button>
              </div>
            ))}
          </div>
        </div>

        {showForm && (
          <Modal title="Novo lançamento" onClose={() => setShowForm(false)}>
            <form onSubmit={submit}>
              <div className="radio-row">
                <label className={"radio-pill" + (draft.type === "entrada" ? " active" : "")}>
                  <input type="radio" checked={draft.type === "entrada"} onChange={() => setDraft({ ...draft, type: "entrada" })} /> Entrada
                </label>
                <label className={"radio-pill" + (draft.type === "saida" ? " active" : "")}>
                  <input type="radio" checked={draft.type === "saida"} onChange={() => setDraft({ ...draft, type: "saida" })} /> Saída
                </label>
              </div>
              <div className="field"><label>Descrição</label><input value={draft.desc} onChange={(e) => setDraft({ ...draft, desc: e.target.value })} required /></div>
              <div className="form-row">
                <div className="field"><label>Valor (R$)</label><input type="number" step="0.01" value={draft.amount} onChange={(e) => setDraft({ ...draft, amount: e.target.value })} required /></div>
                <div className="field"><label>Data</label><input type="date" value={draft.date} onChange={(e) => setDraft({ ...draft, date: e.target.value })} /></div>
              </div>
              <div className="field"><label>Categoria</label><input value={draft.category} onChange={(e) => setDraft({ ...draft, category: e.target.value })} /></div>
              <button className="btn-primary full" type="submit">Salvar Lançamento</button>
            </form>
          </Modal>
        )}
      </div>
    );
  }

  // APP PRINCIPAL COM SINCRONIZAÇÃO NUVEM
  function NellusApp() {
    const [tab, setTab] = useState("agenda");
    const [clients, setClients] = useState([]);
    const [bookings, setBookings] = useState([]);
    const [tx, setTx] = useState([]);
    const [typeLabels, setTypeLabels] = useState({
      presencial: "Presencial",
      salaFixa: "Sala fixa",
      virtual: "Escritório virtual"
    });

    // Ouvintes em tempo real do Firestore
    useEffect(() => {
      if (!isFirebaseActive) {
        // Modo offline de contingência usando localStorage
        const savedClients = localStorage.getItem("nellus_clients");
        if (savedClients) setClients(JSON.parse(savedClients));
        return;
      }

      const unsubClients = db.collection("clients").onSnapshot((snapshot) => {
        setClients(snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() })));
      });

      const unsubBookings = db.collection("bookings").onSnapshot((snapshot) => {
        setBookings(snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() })));
      });

      const unsubTx = db.collection("transactions").onSnapshot((snapshot) => {
        setTx(snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() })));
      });

      const unsubConfig = db.collection("settings").doc("typeLabels").onSnapshot((doc) => {
        if (doc.exists) setTypeLabels(doc.data());
      });

      return () => {
        unsubClients();
        unsubBookings();
        unsubTx();
        unsubConfig();
      };
    }, []);

    // Operações em nuvem
    const handleAdd = (collection, item) => {
      if (isFirebaseActive) {
        db.collection(collection).add(item);
      } else {
        alert("Para salvar para todos os usuários em tempo real, insira suas credenciais do Firebase no código!");
      }
    };

    const handleUpdate = (collection, id, data) => {
      if (isFirebaseActive) {
        db.collection(collection).doc(id).update(data);
      }
    };

    const handleRemove = (collection, id) => {
      if (isFirebaseActive) {
        db.collection(collection).doc(id).delete();
      }
    };

    const handleUpdateLabels = (newLabels) => {
      setTypeLabels(newLabels);
      if (isFirebaseActive) {
        db.collection("settings").doc("typeLabels").set(newLabels, { merge: true });
      }
    };

    return (
      <div className="nellus-app">
        <aside className="sidebar">
          <div className="brand">
            <div className="brand-text">
              <b>Nellus Coworking</b>
              <span>Gestão Centralizada</span>
              <span className="sync-status">
                {isFirebaseActive ? "🟢 Sincronizado na Nuvem" : "⚠️ Modo Local (Configure o Firebase)"}
              </span>
            </div>
          </div>
          <nav className="nav">
            <button className={"nav-item" + (tab === "agenda" ? " active" : "")} onClick={() => setTab("agenda")}>
              📅 Agenda
            </button>
            <button className={"nav-item" + (tab === "clientes" ? " active" : "")} onClick={() => setTab("clientes")}>
              👥 Clientes
            </button>
            <button className={"nav-item" + (tab === "financeiro" ? " active" : "")} onClick={() => setTab("financeiro")}>
              💳 Financeiro
            </button>
          </nav>
          <div className="sidebar-foot">
            <b>Painel Compartilhado</b><br />
            As alterações são salvas e refletidas instantaneamente para qualquer pessoa conectada.
          </div>
        </aside>

        <main className="main">
          {tab === "agenda" && (
            <Agenda
              bookings={bookings}
              clients={clients}
              onAdd={(data) => handleAdd("bookings", data)}
              onUpdate={(id, data) => handleUpdate("bookings", id, data)}
              onRemove={(id) => handleRemove("bookings", id)}
            />
          )}
          {tab === "clientes" && (
            <Clientes
              clients={clients}
              typeLabels={typeLabels}
              setTypeLabels={handleUpdateLabels}
              onAdd={(data) => handleAdd("clients", data)}
              onUpdate={(id, data) => handleUpdate("clients", id, data)}
              onRemove={(id) => handleRemove("clients", id)}
            />
          )}
          {tab === "financeiro" && (
            <Financeiro
              tx={tx}
              onAdd={(data) => handleAdd("transactions", data)}
              onUpdate={(id, data) => handleUpdate("transactions", id, data)}
              onRemove={(id) => handleRemove("transactions", id)}
            />
          )}
        </main>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<NellusApp />);
</script>

</body>
</html>
